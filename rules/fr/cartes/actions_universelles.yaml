# Cartes — Actions universelles (sans prérequis)
# Source : core/actions/universal_actions.md
# Schéma : voir README.md

cartes:
  # ── Actions offensives ──────────────────────────────────────────────────────

  - id: attaque-armee
    nom: Attaque armée
    type: action
    famille: melee
    categorie: offensive
    initiative: 5
    cout: "🌕🌕"
    condition: "tenir une arme ou un objet lourd en main"
    jet: "Puissance 🟨🟨 + Force 🟦"
    contre: "Garde (toutes)"
    defaut: "augmentez votre **fatigue 💧**"
    critique: "la cible subit **🔻**"
    succes: "la cible subit 3 **blessures 💢**"
    echec: "la cible subit 1 **blessure 💢**"
    source: core/actions/universal_actions.md

  - id: attaque-mains-nues
    nom: Attaque à mains nues
    type: action
    famille: melee
    categorie: offensive
    initiative: 3
    cout: "🌓🌓"
    jet: "Puissance 🟨🟨 + Force 🟦"
    contre: "Garde (esquive, parade, dérobade)"
    ameliorations:
      - nom: Poings de fer
        effet: "en cas de succès, votre attaque à mains nues inflige une blessure 💢 supplémentaire"
    defaut: "augmentez votre **fatigue 💧**"
    critique: "la cible est **sonnée 🫨**"
    succes: "infligez 2 **fatigue 💧** à la cible"
    echec: "la cible subit 💧"
    source: core/actions/universal_actions.md

  - id: saisir
    nom: Saisir
    type: action
    famille: melee
    categorie: offensive
    initiative: 3
    cout: "🌓"
    jet: "Robustesse 🟨🟨 + Force 🟦"
    contre: "Garde (esquive, parade, dérobade)"
    ameliorations:
      - nom: Agripper
        effet: "peut être utilisée en **Réaction ⚡** lorsqu'une créature adjacente initie une action de **Marche**, de **Course** ou se **Relève**. Coût : ⚡💧 au lieu de ⚫"
    defaut: "augmentez votre **fatigue 💧**"
    critique: "la cible est **immobilisée 🔗**"
    succes: "la cible est **entravée 🕸️**"
    echec: "la cible subit 💧"
    source: core/actions/universal_actions.md

  - id: jeter
    nom: Jeter
    type: action
    famille: distance
    categorie: offensive
    initiative: 4
    cout: "🌕"
    condition: "tenir un objet en main"
    jet: "Observation 🟨🟨 + Acuité 🟦"
    contre: "Garde (toutes)"
    critique: "la cible est **sonnée 🫨**"
    succes: "effet selon l'objet lancé — petit emplacement : 1 **blessure 💢** ; grand emplacement : 2 **blessures 💢**"
    echec: "la cible subit 1 **fatigue 💧**"
    notes: "les emplacements sont expliqués dans Équipement"
    source: core/actions/universal_actions.md

  - id: intimidation
    nom: Intimidation
    type: action
    famille: sociale
    categorie: offensive
    initiative: 5
    cout: "🌕🌕"
    jet: "Autorité 🟨🟨 + Volonté 🟦"
    contre: "Conviction"
    effet: "si la cible n'a plus de jeton de **Stabilité ◇** : elle subit **🔻** (vers la Peur)"
    succes: "la cible perd **1 ◇** et devient **🌀 Déstabilisée** (ignore son prochain regain de ◇)"
    echec: "la cible perd **1 ◇**"
    critique: "la cible perd **1 ◇** supplémentaire"
    source: core/actions/universal_actions.md

  # ── Déplacement ─────────────────────────────────────────────────────────────

  - id: posture
    nom: Posture
    type: action
    famille: mouvement
    categorie: mouvement
    initiative: 3
    cout: "🌓"
    condition: "ne pas être **immobilisé**"
    effet: "**Inertie 1 ➡️**, déplacement d'une case, puis choisissez votre posture : 🧍 **Debout**, 🧎 **À genoux** ou 🙏 **À terre** (effets décrits dans États)"
    source: core/actions/universal_actions.md

  # UNE carte, DEUX modes. Le deck est organisationnel, pas mécanique : rien
  # n'oblige les modes d'une carte à partager une bande (les cartes tempo portent
  # déjà une amélioration qui les fait passer de la Bande I à la Bande III). Ici
  # les deux modes tombent en Bande II 🌕 — Marche 4️⃣, Course 6️⃣.
  #
  # Aucun jet : franchir du terrain ne se rate pas. Le frein n'est plus un ⚠️
  # Défaut mais l'essoufflement lui-même, qui interdit de courir la manche
  # suivante — même boucle qu'avant, sans les dés.
  - id: deplacement
    nom: Déplacement
    type: action
    famille: mouvement
    categorie: mouvement
    # La carte EST la Marche : elle garde son initiative et son coût en tête. La
    # Course est une variante — on force l'allure, l'initiative recule et le
    # souffle se paie.
    initiative: 4
    cout: "🌕"
    condition: "ne pas être **à terre** ou **immobilisé**"
    effet: "🚶 **Marche** — **Inertie 2 ➡️**, déplacement de **3 cases**"
    modes:
      - id: course
        nom: "🏃 Course"
        initiative: 6
        cout: "🌕💧"
        condition: "ne pas être **à genoux**, **à terre**, **entravé**, ni **essoufflé**"
        effet: "**Inertie 3 ➡️**, déplacement de **5 + Mobilité ✫** cases, puis vous êtes **essoufflé 😮‍💨**"
    source: core/actions/universal_actions.md

  - id: bousculade
    nom: Bousculade
    type: action
    famille: mouvement
    categorie: offensive
    initiative: 5
    cout: "🌕"
    condition: "disposer d'un niveau d'**Inertie ➡️ 3** (ou plus)"
    jet: "Mobilité 🟨🟨 + Agilité 🟦, avec 🟩"
    contre: "Garde (esquive, dérobade)"
    defaut: "augmentez votre **fatigue 💧**"
    critique: "la cible est **sonnée 🫨**"
    effet: "**Inertie ➡️ 0**"
    succes: "la cible est **à terre 🙏**"
    echec: "la cible est **à genoux 🧎**"
    source: core/actions/universal_actions.md

  # ── Utilitaires ─────────────────────────────────────────────────────────────

  - id: reprendre-conscience
    nom: Reprendre Conscience
    type: action
    famille: utilitaire
    categorie: guerison
    initiative: 1
    cout: "🌓"
    condition: "être **sonné 🫨** ou **inconscient 😵‍💫**"
    jet: "Récupération 🟨🟨 + Vigueur 🟦"
    contre: "DD = niveau de **fatigue 💧**"
    defaut: "l'action requiert un **⚫** supplémentaire"
    critique: "gagnez un jeton **Stabilité ◇**"
    succes: "le personnage perd l'état **sonné** ou **inconscient**"
    echec: "le personnage réduit sa **fatigue 💧** d'un point plus sa valeur de **Récupération**"
    source: core/actions/universal_actions.md

  - id: eteindre-les-flammes
    nom: Éteindre les flammes
    type: action
    famille: utilitaire
    categorie: guerison
    initiative: 1
    cout: "🌓🌓"
    jet: "Prestance 🟨🟨 + Grâce 🟦"
    contre: "DD = nombre de marqueurs **brûlure 🔥**"
    critique: "gagnez un jeton **Stabilité ◇**"
    succes: "supprimez toutes vos **brûlures 🔥**"
    echec: "supprimez **5 brûlures 🔥**"
    source: core/actions/universal_actions.md
