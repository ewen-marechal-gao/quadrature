# Source de vérité du cladogramme de la faune d'Aeonir.
# Source de vérité = ce YAML. (faune_arbre.svg et tools/gen-faune-arbre.mjs sont DÉPRÉCIÉS,
# remplacés par une visualisation web ; ne plus régénérer le SVG.)
# Champs d'un nœud : name+ref (clade interne) | tip+cd (feuille) ; biome (sous-ensemble de NLCS) ;
# status (done|todo) ; mut (n° d'une mutation d'Aeonir, pastille sur le nœud) ; star ; branchNote ; children.

title: "Arbre phylogénétique de la vie d'Aeonir — état courant (mis à jour à chaque grade peuplé)"
rootNote: "racine : hétérotrophe · électrosensible · sexuée (méiose)"

# Backlog d'idées (à développer plus tard ; non structuré dans l'arbre).
backlog:
  - "Migrateurs du LEVANT = milieu de JUNGLE → évolution divergente en formes de jungle."
  - "Migrateurs du COUCHANT = grandes STEPPES d'herbe pourpre → la forme terrestre se spécialise pour la vie au pâturage (brouteurs des steppes)."
  - "COUCHANT : une branche subit une ATROPHIE DES MEMBRES → convergence vers l'équivalent du Serpent (apode secondaire)."
  - "Hétérodontie (dents différenciées : incisives / canines / molaires) — grade mammifère, à poser vers les Synapsides."

# Mutations spécifiques d'Aeonir, numérotées. Le n° apparaît sur le nœud (champ mut) où la mutation surgit.
mutations:
  - "Endosymbiose pourpre"
  - "Sacs d'hydrogène"
  - "Cristallisation (l'Arche)"
  - "Flore mobile / prédatrice"
  - "Symétrie tri-radiale"
  - "Néoténie (vie & repro aquatiques)"
  - "Émetteur EM (télépathie active)"
  - "Carapace chitino-ferrique"
  - "Trois paires de nageoires (plan hexapode)"
  - "Sidérotropisme centrifuge (fer → cortex)"
  - "Sidérotropisme centripète (corde dorsale)"
  - "Cage de Faraday (résistance EM)"
  - "Symétrie bilatérale"
  - "Métamérie (segmentation)"
  - "Exosquelette à mue"
  - "Squelette axial + tête"
  - "Mâchoires"
  - "Nageoires charnues"
  - "Membres porteurs (sortie de l'eau)"
  - "Œuf amniote"
  - "Vision (yeux)"
  - "Ailes dorsales (draconides)"
  - "Quadrupédie (6→4 membres)"
  - "Ectothermie"
  - "Endothermie"
  - "Cursorialité"
  - "Poumons + peau respirante"
  - "Métamorphose migratoire (seuil thermique)"
  - "Levant : seuil chaud-sec"
  - "Couchant : seuil froid-humide"
  - "Première paire d'ailes"
  - "Seconde paire d'ailes"
  - "Fourrure (isolation dense)"
  - "Viviparité"
  - "Poches de graisse"
  - "Vision frontale (binoculaire)"
  - "Plasticité podale (pied modulable)"
  - "Récepteur EM externe (épines)"
  - "Encéphalisation (signaux complexes)"
  - "Bipédie"
  - "Redressement (station verticale)"
  - "Mains préhensiles (membres antérieurs)"
  - "Tissus vrais (gastrula)"
  - "Céphalisation : un AVANT + photoception"
  - "Tube digestif complet"
  - "Circulation (sang ferrique)"
  - "Ossification (os porteur)"
  - "Allaitement (lactation)"

root:
  children:
    - name: "POURPRES"
      ref: "autotrophes — algues, plantes"
      mut: 1
      children:
        - branchNote: "sessiles à dispersion"
          children:
            - { tip: "Pionniers anémochores", cd: "herbe pourpre", status: done, biome: LC }
            - { tip: "Aéroplanctes", cd: "flotteurs aériens", biome: NLC, mut: 2 }
            - { tip: "Arbre-Anneau", cd: "l'Arche — franchit la Nuit · réf. Pando", biome: NLC, star: true, mut: 3 }
        - branchNote: "réfugiaux polaires"
          children:
            - { tip: "Endémiques Nord — marais", biome: N }
            - { tip: "Endémiques Sud — toundra", biome: S }
        - { tip: "Phyterrants", cd: "flore mobile · réf. Dionée, Euglène", biome: LC, mut: 4 }
    - name: "ZOÏDES"
      ref: "animaux — Metazoa"
      children:
        - { tip: "Filtreurs", cd: "Métazoïdes · réf. éponge", status: done, biome: NC }
        - name: "EUMÉTAZOÏDES"
          ref: "cnidaire, ver…"
          mut: 43
          children:
            - name: "RADIÉS"
              ref: "méduse, hydre"
              children:
                - { tip: "Radiés", cd: "polypes & méduses", status: done, biome: NC }
                - { tip: "Trilatériens", cd: "tri-radial · réf. Tribrachidium †", status: todo, biome: LC, mut: 5 }
            - name: "VERMIFORMES"
              ref: "céphalisation : un AVANT nerveux + taches photosensibles (polarité A-P)"
              mut: 44
              children:
                - { tip: "Plats", cd: "vers plats : un avant + cerveau, mais intestin aveugle · réf. planaire", status: todo, biome: NC }
                - name: "Tube digestif"
                  ref: "intestin traversant : bouche → broyage → absorption → anus ; alimentation continue et efficace"
                  mut: 45
                  children:
                    - { tip: "les Vers", cd: "fouisseurs / brouteurs à tube digestif traversant (sens unique)", status: done, biome: LC }
                    - name: "BILATÉRIENS"
                      ref: "symétrie L/R (gauche-droite, appendices pairs)"
                      mut: 13
                      children:
                        - { tip: "Vers ronds", cd: "tube digestif mais SANS circulation · réf. nématode", status: todo, biome: NC }
                        - name: "Circulation"
                          ref: "sang ferrique : cœur + vaisseaux, pigment respiratoire au fer → métabolisme et taille accrus ; fournit le fer routé par le Sidérotropisme"
                          mut: 46
                          children:
                            - name: "EXOFERRES"
                              ref: "fer centrifuge → cortex/cuticule (cuirasse, coquille)"
                              mut: 10
                              children:
                                - { tip: "Non-segmentés", cd: "pied musculeux · réf. mollusque", status: done, biome: NC }
                                - name: "SEGMENTÉS"
                                  ref: "segments répétés"
                                  mut: 14
                                  children:
                                    - { tip: "Homonomes", cd: "mille-pattes · réf. Arthropleura †", status: done, biome: NLC }
                                    - { tip: "Exosquelette", cd: "arthropodes tagmatisés, à mue · réf. trilobite †, insecte", status: done, biome: NLC, mut: 15 }
                            - name: "ENDOFERRES"
                              ref: "fer centripète → axe interne (corde dorsale ferrique)"
                              mut: 11
                              children:
                                - { tip: "Sidérocordés", cd: "cordé mou aquatique : corde ferrique, sans squelette ; électro-communiquant · réf. amphioxus, poisson-couteau électrique", status: done, biome: NC }
                                - name: "ENDOSQUELETTE"
                                  ref: "petit nageur ondulant : vertèbres ferro-cartilagineuses + tête/crâne"
                                  mut: 16
                                  children:
                                    - { tip: "Agnathes", cd: "sans mâchoire, anguilliformes · réf. lamproie, myxine", status: todo, biome: NC }
                                    - name: "HEXAPINNÉS"
                                      ref: "3 paires de nageoires paires (= futurs membres)"
                                      mut: 9
                                      children:
                                        - { tip: "Cuirassés sans mâchoire", cd: "à nageoires mais agnathes · réf. ostracodermes †", status: todo, biome: NC }
                                        - name: "Gnathostomes"
                                          ref: "mâchoires + dents → préhension et mastication : prédation active"
                                          mut: 17
                                          children:
                                            - { tip: "Mâchus", cd: "prédateurs aquatiques à squelette cartilagineux · réf. requins", status: todo, biome: NC }
                                            - name: "SARCOPTÉRYGIENS"
                                              ref: "nageoires charnues / lobées → reptation des hauts-fonds"
                                              mut: 18
                                              children:
                                                - { tip: "Lobés aquatiques", cd: "lobés restés en eau · réf. cœlacanthe, dipneuste", status: todo, biome: NC }
                                                - name: "MEMBRÉS"
                                                  ref: "membres porteurs : nageoires charnues → pattes ; tétrapode-souche encore aquatique · réf. Ichthyostega †"
                                                  mut: 19
                                                  children:
                                                    - { tip: "Tétrapodes aquatiques", cd: "branchies conservées, restés en eau · réf. Acanthostega †", status: todo, biome: NC }
                                                    - name: "Ossification"
                                                      ref: "os vrai porteur : la gravité hors de l'eau impose un squelette ossifié (les aquatiques restent ferro-cartilagineux)"
                                                      mut: 47
                                                      children:
                                                        - { tip: "Rampants des hauts-fonds", cd: "os porteur mais branchies : rampent dans les vasières · réf. tétrapodes basaux †", status: todo, biome: NC }
                                                        - name: "AMPHIBIENS"
                                                          ref: "poumons + peau respirante ; double vie"
                                                          mut: 27
                                                          children:
                                                            - name: "MUANTS"
                                                              ref: "néoténie : vivent & se reproduisent comme des poissons"
                                                              mut: 6
                                                              children:
                                                                - { tip: "Sédentaires", cd: "néoténiques permanents, ne métamorphosent jamais · réf. axolotl", status: todo, biome: NC }
                                                                - name: "MIGRATEURS"
                                                                  ref: "métamorphose migratoire : au seuil thermique, pattes + sortie d'eau → migration vers de nouvelles zones humides"
                                                                  mut: 28
                                                                  children:
                                                                    - { tip: "Levant", cd: "métamorphose & migre quand trop chaud & sec", status: todo, biome: LC, mut: 29 }
                                                                    - { tip: "Couchant", cd: "métamorphose & migre quand froid & humide", status: todo, biome: LC, mut: 30 }
                                                            - name: "ANNULUS"
                                                              ref: "œuf amniote clos → reproduction hors de l'eau ; conquérants de l'anneau du terminateur"
                                                              mut: 20
                                                              children:
                                                                - name: "AVEUGLES"
                                                                  ref: "hexapodes aveugles (6 membres, électroception), antérieurs à la vision · prédateurs"
                                                                  children:
                                                                    - { tip: "Draconides", cd: "aveugles ailés (paire dorsale → ailes) : « dragons » prédateurs", status: todo, biome: NLC, mut: 22 }
                                                                    - { tip: "Terrestres aveugles", cd: "restent au sol ; radiation souterraine à venir", status: todo, biome: LC }
                                                                - name: "VISUELS"
                                                                  ref: "œil vrai (formation d'image) : upgrade des taches photosensibles ; exploite la lumière du terminateur"
                                                                  mut: 21
                                                                  children:
                                                                    - name: "SAUROPSIDES"
                                                                      ref: "écailles · ectothermes héliothermes · 6 membres conservés"
                                                                      mut: 24
                                                                      children:
                                                                        - name: "Hexapodes terrestres"
                                                                          ref: "0 paire d'ailes : « crocodiles à 6 pattes »"
                                                                          children:
                                                                            - { tip: "Carapaçonnés", cd: "armure dermique chitino-ferrique (convergente) · réf. tortue, ankylosaure †", status: done, biome: LCS, mut: 8 }
                                                                            - { tip: "Coureurs de troupeaux", cd: "cursoriaux · réf. dinosaures grégaires, sauropodes †", status: done, biome: NLCS, mut: 26 }
                                                                        - name: "Ailés"
                                                                          ref: "≥ 1 paire de membres → ailes"
                                                                          mut: 31
                                                                          children:
                                                                            - { tip: "Lézards ailés", cd: "1 paire d'ailes : 4 pattes + 2 ailes", status: todo, biome: NLC }
                                                                            - { tip: "Oiseaux", cd: "2 paires d'ailes : 2 pattes + 4 ailes ; endothermie convergente", status: todo, biome: NLC, mut: 32 }
                                                                    - name: "SYNAPSIDES"
                                                                      ref: "endothermes (sang chaud) → lignée mammifère"
                                                                      mut: 25
                                                                      children:
                                                                        - { tip: "Pondeurs tempérés", cd: "monotrème-grade : ovipares électro-sensibles · réf. ornithorynque, échidné", status: todo, biome: NLC }
                                                                        - name: "Fourrés"
                                                                          ref: "pôle Sud : fourrure dense (isolation)"
                                                                          mut: 33
                                                                          children:
                                                                            - { tip: "Pondeurs australs", cd: "poilus, ovipares, SANS lait : grade pré-lactation du Sud froid", status: todo, biome: S }
                                                                            - name: "Allaitement"
                                                                              ref: "lactation : nourrit le petit au lait — apparaît AVANT la viviparité (grade monotrème : œuf + lait)"
                                                                              mut: 48
                                                                              children:
                                                                                - { tip: "Pondeurs laitiers", cd: "poilus à 6 pattes : pondent ET allaitent (œufs + lait — omelettes & fromage) ; bétail nourricier austral · réf. ornithorynque, échidné", status: todo, biome: S }
                                                                                - name: "Vivipares"
                                                                                  ref: "gestation interne → re-colonisent le Nord (mammifères vrais)"
                                                                                  mut: 34
                                                                                  children:
                                                                                    - { tip: "Bétail", cd: "6 membres + poches de graisse : gros herbivores lents, troupeaux ; élevés au Sud", status: todo, biome: S, mut: 35 }
                                                                                    - name: "Quadrupèdes"
                                                                                      ref: "6→4 membres ; prédateurs de meute — socle de la lignée sapiente"
                                                                                      mut: 23
                                                                                      children:
                                                                                        - { tip: "Prédateurs de meute", cd: "carnassiers grégaires basaux · réf. loups, raptors de meute", status: todo, biome: NLCS }
                                                                                        - name: "Vision frontale"
                                                                                          ref: "yeux frontaux : vision binoculaire, relief (chasse de précision)"
                                                                                          mut: 36
                                                                                          children:
                                                                                            - { tip: "Guetteurs", cd: "prédateurs à l'affût, vision stéréo · réf. félins, chouettes", status: todo, biome: NLCS }
                                                                                            - name: "Plasticité podale"
                                                                                              ref: "pied modulable (kératine / posture / sole) → quitte le Sud, reconquiert tous les biomes"
                                                                                              mut: 37
                                                                                              children:
                                                                                                - { tip: "Coureurs adaptables", cd: "généralistes répandus, pied passe-partout", status: todo, biome: NLCS }
                                                                                                - name: "Récepteur EM externe"
                                                                                                  ref: "fourrure → épines EM réceptrices : électrosensibilité polydirectionnelle ; dans les jungles"
                                                                                                  mut: 38
                                                                                                  children:
                                                                                                    - { tip: "Épineux sylvestres", cd: "hérissés d'épines EM, électrosensibles, petit cerveau", status: todo, biome: L }
                                                                                                    - name: "Encéphalisation"
                                                                                                      ref: "gros cerveau social : traite les signaux EM complexes"
                                                                                                      mut: 39
                                                                                                      children:
                                                                                                        - { tip: "Rusés", cd: "malins et coopératifs, sans organe émetteur", status: todo, biome: L }
                                                                                                        - name: "Émetteur EM"
                                                                                                          ref: "organe émissif actif → télépathie (émission + réception + cerveau)"
                                                                                                          mut: 7
                                                                                                          children:
                                                                                                            - { tip: "Télépathes quadrupèdes", cd: "psychiques à quatre pattes, meutes coordonnées par EM", status: todo, biome: L }
                                                                                                            - name: "Bipédie"
                                                                                                              ref: "locomotion sur les membres postérieurs : antérieurs libérés ; dos encore incliné"
                                                                                                              mut: 40
                                                                                                              children:
                                                                                                                - { tip: "Coureurs bipèdes", cd: "« raptors » : bipèdes à bras-pattes réduits · réf. théropodes", status: todo, biome: L }
                                                                                                                - name: "Redressement"
                                                                                                                  ref: "station verticale : antenne EM dressée, mains potentielles libérées"
                                                                                                                  mut: 41
                                                                                                                  children:
                                                                                                                    - { tip: "Dressés sans mains", cd: "bipèdes verticaux télépathes, sans mains : brutes quasi-Peuples", status: todo, biome: L }
                                                                                                                    - name: "PEUPLES"
                                                                                                                      ref: "membres antérieurs → mains préhensiles : l'outil et la culture ; une espèce, 4 races interfécondes"
                                                                                                                      mut: 42
                                                                                                                      children:
                                                                                                                        - { tip: "Cimes", cd: "jungle : re-grimpeurs (mains + sole agrippante), épines EM polydirectionnelles, peau pâle", status: todo, biome: L }
                                                                                                                        - { tip: "Vents", cd: "steppes : sabots ungulés (cheville surélevée), longues cornes directionnelles, oreilles pointues", status: todo, biome: C }
                                                                                                                        - { tip: "Neiges", cd: "pôle Sud : larges sabots, petite taille + pilosité, cornes luminescentes, peau sombre", status: todo, biome: S }
                                                                                                                        - { tip: "Pluies", cd: "pôle Nord : griffes palmées (nage), longs membres, couronne de cornes discrète, oreilles-capuchon", status: todo, biome: N }
