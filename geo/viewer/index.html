<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aeonir — relief du terminateur</title>

<!-- Bibliothèque vendue localement et épinglée dans package.json, plutôt que
     tirée d'un CDN : un visualiseur dont le comportement dépend d'un tiers
     n'est pas un outil de mesure. `npm install` depuis geo/viewer.

     ⚠️ MapLibre 6 est **ESM uniquement** — le bundle UMD a disparu, donc la
     variable globale `maplibregl` n'existe plus. Le chargement se fait par
     `<script type="module">` et un `import`, pas par `<script src>`. -->
<link href="./node_modules/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />

<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #05070a; }
  #map { position: absolute; inset: 0; }

  #hud {
    position: absolute; top: 12px; left: 12px; z-index: 2;
    background: rgba(8, 11, 16, .86);
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 6px; padding: 10px 12px;
    font: 12px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: #d8dee8; min-width: 250px;
  }
  #hud h1 { font-size: 12px; margin: 0 0 8px; letter-spacing: .06em;
            text-transform: uppercase; color: #8fa3bd; font-weight: 600; }
  #hud dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px;
            margin: 0; }
  #hud dt { color: #6f8299; }
  #hud dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  #hud .sep { grid-column: 1 / -1; height: 1px; margin: 6px 0;
              background: rgba(255, 255, 255, .1); }
  #hud button {
    margin-top: 9px; width: 100%; padding: 5px; cursor: pointer;
    background: #16202e; color: #d8dee8; font: inherit;
    border: 1px solid rgba(255, 255, 255, .18); border-radius: 4px;
  }
  #hud button[aria-pressed="true"] { background: #24435f; border-color: #47739b; }
  #legende { margin: 9px 0 0; font-size: 11px; line-height: 1.7; color: #8fa3bd; }
  #erreur { color: #ff9b9b; grid-column: 1 / -1; }
</style>
</head>
<body>
<div id="map"></div>

<div id="hud">
  <h1>Aeonir · repère Étoile</h1>
  <dl>
    <dt>zoom</dt><dd id="zoom">—</dd>
    <dt>tuile</dt><dd id="tuile">—</dd>
    <div class="sep"></div>
    <dt>longitude'</dt><dd id="lon">—</dd>
    <dt>latitude'</dt><dd id="lat">—</dd>
    <dt>élévation ☀</dt><dd id="soleil">—</dd>
    <dt>altitude</dt><dd id="alt">—</dd>
    <div class="sep"></div>
    <dt>époque</dt><dd id="epoque">—</dd>
    <dd id="erreur"></dd>
  </dl>
  <button id="relief3d" aria-pressed="false">relief 3D</button>
  <button id="deuxsources" aria-pressed="false">deux sources (monde + bande)</button>
  <button id="graticule" aria-pressed="false">parallèles &amp; méridiens</button>
  <button id="tuiles" aria-pressed="false">bords de tuiles (z/x/y)</button>
  <p id="legende" hidden>
    <span style="color:#e8eef7">—</span> équateur Étoile (terminateur)<br>
    <span style="color:#e09a5a">—</span> Mur des Tempêtes +6°<br>
    <span style="color:#7fb6e0">—</span> Linceul −21°<br>
    <span style="color:#6b7f99">╌</span> emprise des tuiles de bande
  </p>
</div>

<script type="module">
// ⚠️ Import de NAMESPACE, pas d'import par défaut : MapLibre 6 n'expose que
// des exports nommés (`Map`, `NavigationControl`, …) et plus aucun `default`.
// Un `import maplibregl from …` échoue en « does not provide an export
// named 'default' ».
import * as maplibregl from "./node_modules/maplibre-gl/dist/maplibre-gl.mjs";

// Le client lit le contrat AVANT de demander la moindre tuile : c'est tout
// l'objet de TileJSON. minzoom, maxzoom et bounds en sortent, jamais du code.
const TILEJSON = "/out/tiles/tiles.json";
const $ = (id) => document.getElementById(id);

/**
 * Éclairage commun aux deux ombrages.
 *
 * L'étoile est au pôle nord du repère Étoile — par définition, puisque ce pôle
 * EST le point substellaire. La lumière vient donc du nord, et non des 335°
 * par défaut, hérités d'une convention de cartes terrestres.
 */
const ECLAIRAGE = {
  "hillshade-illumination-direction": 0,
  "hillshade-illumination-anchor": "map",
  "hillshade-shadow-color": "#050a12",
  "hillshade-highlight-color": "#cfe0f2",
  "hillshade-accent-color": "#33506e",
};

/**
 * Longitude/latitude → indices de tuile XYZ.
 *
 * Rappel : x est linéaire en longitude, y est un logarithme de latitude, et
 * aucun rayon planétaire n'intervient. C'est ce qui permet d'appliquer
 * WebMercatorQuad à Aeonir sans mentir sur sa taille.
 */
function tileIndex(lon, lat, zoom) {
  const side = 2 ** zoom;
  const phi = lat * Math.PI / 180;
  const y = (1 - Math.log(Math.tan(phi) + 1 / Math.cos(phi)) / Math.PI) / 2;
  return {
    x: Math.floor(((lon + 180) / 360) * side),
    y: Math.min(side - 1, Math.max(0, Math.floor(y * side))),
  };
}

/** Latitude de coupure de Web Mercator — gd(π), voir tiles.py. */
const LIMITE = 85.0511287798066;

/**
 * Construit la graticule en GeoJSON.
 *
 * MapLibre n'en fournit aucune : c'est une couche `line` comme une autre.
 *
 * ⚠️ Chaque ligne est **densifiée** alors qu'en Mercator plan deux sommets
 * suffiraient — un méridien y est vertical, un parallèle horizontal. La
 * densification ne sert pas à la projection mais au **drapé sur le relief 3D** :
 * sans elle, une ligne tendue traverserait les montagnes au lieu d'en épouser
 * la surface.
 *
 * Les latitudes remarquables ne sont pas décoratives. Dans le repère Étoile la
 * latitude EST l'élévation de l'étoile, donc l'équateur est le milieu du
 * terminateur, +6° le Mur des Tempêtes et −21° le Linceul. La graticule dit
 * ici quelque chose du monde, pas seulement de la grille.
 */
function construireGraticule(aeonir, pas = 15, sommets = 8) {
  const features = [];
  const ligne = (points, couleur, largeur, tirets) => features.push({
    type: "Feature",
    properties: { couleur, largeur, tirets },
    geometry: { type: "LineString", coordinates: points },
  });
  const echelonner = (a, b) => Array.from(
    { length: sommets + 1 }, (_, i) => a + (b - a) * (i / sommets));

  // ⚠️ Un parallèle se trace PAR TRONÇONS, jamais d'un bord du monde à
  // l'autre. Une polyligne unique de −180° à +180° est un cas dégénéré pour
  // le retuilage côté client de la source GeoJSON : elle ne survit que dans
  // la tuile contenant son point de départ. Symptôme observé — les parallèles
  // n'apparaissaient que dans les tuiles `x = 0`, alors que les méridiens,
  // naturellement courts, s'affichaient partout.
  const parallele = (lat, couleur, largeur, tirets) => {
    for (let lon = -180; lon < 180; lon += pas) {
      ligne(echelonner(lon, lon + pas).map((l) => [l, lat]),
            couleur, largeur, tirets);
    }
  };

  for (let lon = -180; lon < 180; lon += pas) {
    ligne(echelonner(-LIMITE, LIMITE).map((lat) => [lon, lat]),
          "#3a4c63", 0.6, 0);
  }
  for (let lat = -75; lat <= 75; lat += pas) {
    if (lat === 0) continue;
    parallele(lat, "#3a4c63", 0.6, 0);
  }

  // Les lignes qui portent du sens.
  const remarquable = parallele;

  remarquable(0, "#e8eef7", 1.4, 0);                       // équateur Étoile
  remarquable(aeonir.band.north_deg, "#e09a5a", 1.2, 0);   // Mur des Tempêtes
  remarquable(aeonir.band.south_deg, "#7fb6e0", 1.2, 0);   // Linceul
  // L'emprise RÉELLEMENT tuilée, qui déborde les seuils du lore : c'est elle
  // qui explique la transition de netteté visible sur la carte.
  remarquable(aeonir.band_bounds[3], "#6b7f99", 1.0, 1);
  remarquable(aeonir.band_bounds[1], "#6b7f99", 1.0, 1);

  return { type: "FeatureCollection", features };
}

fetch(TILEJSON)
  .then((r) => { if (!r.ok) throw new Error(`${TILEJSON} → HTTP ${r.status}`);
                 return r.json(); })
  .then(demarrer)
  .catch((e) => { $("erreur").textContent = e.message; });

function demarrer(tilejson) {
  // Le gabarit du TileJSON est relatif au document ; on le résout ici plutôt
  // que d'écrire un chemin en dur, pour que le même fichier serve en local
  // comme derrière un CDN.
  //
  // ⚠️ Surtout pas `new URL(gabarit, base)` : les accolades de `{z}/{x}/{y}`
  // en ressortiraient encodées en %7B…%7D, et MapLibre ne reconnaîtrait plus
  // ses substitutions. On résout le RÉPERTOIRE — qui, lui, n'a pas
  // d'accolades — puis on concatène.
  const repertoire = new URL(".", new URL(TILEJSON, location.href)).href;
  const gabarit = repertoire + tilejson.tiles[0];
  const a = tilejson.aeonir;

  $("epoque").textContent = `${a.epoch_a} a`;

  const map = new maplibregl.Map({
    container: "map",
    hash: true,
    center: [0, 0],
    zoom: 2.2,
    maxPitch: 75,
    style: {
      version: 8,
      // DEUX sources sur le même jeu de tuiles, distinguées par la plage de
      // zoom et l'emprise qu'elles déclarent. C'est le seul moyen d'exprimer
      // « monde entier jusqu'à split_zoom, ruban au-delà » : une source
      // `raster-dem` n'a qu'un couple bounds/maxzoom.
      //
      // Sous son `minzoom`, MapLibre ne couvre pas une source du tout — donc
      // « bande » n'existe qu'à partir de z=5, et hors de son emprise elle
      // n'est jamais demandée. Résultat : **plus aucun 404**.
      sources: {
        // Le montage d'origine : UNE source couvrant tous les niveaux, avec
        // l'emprise globale. Au-delà de z=4 elle réclame des tuiles hors bande
        // qui n'existent pas — d'où les 404 et la coupure. Conservée pour
        // pouvoir comparer les deux montages.
        relief: {
          type: "raster-dem",
          tiles: [gabarit],
          encoding: tilejson.encoding,
          tileSize: 256,
          minzoom: tilejson.minzoom,
          maxzoom: tilejson.maxzoom,
          bounds: tilejson.bounds,
          attribution: "Aeonir — Quadrature",
        },
        monde: {
          type: "raster-dem",
          tiles: [gabarit],
          // ⚠️ Sans cette ligne, MapLibre décode en terrain-RGB Mapbox et
          // rend des altitudes fausses de plusieurs milliers de mètres.
          encoding: tilejson.encoding,
          tileSize: 256,
          minzoom: tilejson.minzoom,
          maxzoom: a.split_zoom,
          bounds: tilejson.bounds,
          attribution: "Aeonir — Quadrature",
        },
        bande: {
          type: "raster-dem",
          tiles: [gabarit],
          encoding: tilejson.encoding,
          tileSize: 256,
          minzoom: a.split_zoom + 1,
          maxzoom: tilejson.maxzoom,
          // L'emprise RENDUE, pas les seuils climatiques : une ligne de
          // tuiles entamée est rendue en entier, donc elle déborde.
          bounds: a.band_bounds,
        },
        graticule: {
          type: "geojson",
          data: construireGraticule(a),
        },
      },
      layers: [
        { id: "fond", type: "background",
          paint: { "background-color": "#05070a" } },
        {
          // Montage à UNE source — visible par défaut.
          id: "ombrage-relief", type: "hillshade", source: "relief",
          layout: { visibility: "visible" },
          paint: { ...ECLAIRAGE, "hillshade-exaggeration": 0.85 },
        },
        {
          // Le fond de relief : présent partout, suragrandi au-delà de z=4.
          //
          // ⚠️ Exagération CONSTANTE. J'avais tenté de la faire décroître au
          // profit de la bande, pour éviter que deux ombrages du même relief
          // ne s'additionnent. Le remède était pire : hors de la bande, où le
          // fond est seul, il ne restait presque rien à voir au-delà de z=5.
          // La frontière se lit maintenant comme un gain de netteté, ce qui
          // est l'information juste — il y a bien plus de détail là.
          id: "ombrage-monde", type: "hillshade", source: "monde",
          layout: { visibility: "none" },
          paint: { ...ECLAIRAGE, "hillshade-exaggeration": 0.85 },
        },
        {
          // Le relief net du terminateur, par-dessus.
          id: "ombrage-bande", type: "hillshade", source: "bande",
          layout: { visibility: "none" },
          paint: { ...ECLAIRAGE, "hillshade-exaggeration": 0.85 },
        },
        // Éteinte au départ ; le style n'ayant pas de `glyphs`, aucun calque
        // `symbol` n'est possible — donc pas de libellés, et l'information
        // passe par la couleur, expliquée dans la légende du panneau.
        //
        // ⚠️ DEUX calques, et non un seul avec une expression sur les tirets :
        // `line-dasharray` n'est **pas** pilotable par entité. Le motif est
        // rendu via une texture construite par calque, donc un `["get", …]` y
        // est refusé à la validation. `line-color` et `line-width`, eux, le
        // supportent — d'où le filtre plutôt que la duplication complète.
        {
          id: "graticule", type: "line", source: "graticule",
          filter: ["!=", ["get", "tirets"], 1],
          layout: { visibility: "none", "line-cap": "round" },
          paint: {
            "line-color": ["get", "couleur"],
            "line-width": ["get", "largeur"],
            "line-opacity": 0.85,
          },
        },
        {
          id: "graticule-bande", type: "line", source: "graticule",
          filter: ["==", ["get", "tirets"], 1],
          layout: { visibility: "none" },
          paint: {
            "line-color": ["get", "couleur"],
            "line-width": ["get", "largeur"],
            "line-opacity": 0.9,
            "line-dasharray": [4, 3],
          },
        },
      ],
    },
  });

  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));
  map.addControl(new maplibregl.ScaleControl({ unit: "metric" }));

  // Exposé volontairement : un visualiseur sert à inspecter, et le module ne
  // laisserait rien atteindre depuis la console autrement.
  window.carte = map;
  window.tilejson = tilejson;

  // ── Le relief 3D ────────────────────────────────────────────────────
  // L'exagération n'est pas un réglage esthétique : Aeonir est 1,336 fois
  // plus petite que la Terre, et MapLibre raisonne en rayon terrestre. Ce
  // facteur restitue la proportion angulaire correcte. Il vient du TileJSON.
  //
  // Le relief 3D ne peut viser qu'UNE source, indépendamment du montage de
  // l'ombrage. On le pointe sur « relief », la seule qui couvre à la fois tous
  // les niveaux et tout le globe.
  const bouton = $("relief3d");
  bouton.addEventListener("click", () => {
    const actif = bouton.getAttribute("aria-pressed") === "true";
    map.setTerrain(actif ? null
      : { source: "relief", exaggeration: a.terrain_exaggeration });
    bouton.setAttribute("aria-pressed", String(!actif));
  });

  /** Bascule un bouton et renvoie son nouvel état. */
  const basculer = (id, effet) => {
    const b = $(id);
    b.addEventListener("click", () => {
      const suivant = b.getAttribute("aria-pressed") !== "true";
      b.setAttribute("aria-pressed", String(suivant));
      effet(suivant);
    });
  };

  // Bascule entre les deux montages, pour les comparer sur la même vue.
  //
  //   éteint  — UNE source, z=0..6, emprise globale. Au-delà de z=4 elle
  //             réclame des tuiles hors bande qui n'existent pas : 404, et
  //             MapLibre laisse ce qu'il peut.
  //   allumé  — DEUX sources : le monde jusqu'à z=4, la bande au-delà, chacune
  //             ne demandant que ce qui existe.
  basculer("deuxsources", (actif) => {
    map.setLayoutProperty("ombrage-relief", "visibility",
                          actif ? "none" : "visible");
    for (const couche of ["ombrage-monde", "ombrage-bande"]) {
      map.setLayoutProperty(couche, "visibility", actif ? "visible" : "none");
    }
  });

  basculer("graticule", (actif) => {
    for (const couche of ["graticule", "graticule-bande"]) {
      map.setLayoutProperty(couche, "visibility", actif ? "visible" : "none");
    }
    $("legende").hidden = !actif;
  });

  // Drapeau de débogage natif de MapLibre : il trace le contour de chaque
  // tuile ET son triplet z/x/y, sans avoir besoin de `glyphs` — il embarque
  // sa propre fonte. Voisins utiles : showCollisionBoxes, showPadding,
  // showOverdrawInspector.
  basculer("tuiles", (actif) => { map.showTileBoundaries = actif; });

  // ── Lecture ─────────────────────────────────────────────────────────
  const rafraichirZoom = () => {
    const z = map.getZoom();
    $("zoom").textContent = z.toFixed(2);
  };
  map.on("move", rafraichirZoom);
  map.on("load", rafraichirZoom);

  map.on("mousemove", (e) => {
    // ⚠️ Replier la longitude. Avec `renderWorldCopies`, MapLibre rapporte la
    // position dans la copie survolée : −204,244° pour un point qui est à
    // +155,756°. Sans repli, le HUD affiche une longitude hors de [−180, 180[
    // et un indice de tuile NÉGATIF, qui ne désigne aucun fichier.
    const lng = ((e.lngLat.lng + 180) % 360 + 360) % 360 - 180;
    const lat = e.lngLat.lat;
    const zoom = Math.min(tilejson.maxzoom, Math.floor(map.getZoom()));
    const t = tileIndex(lng, lat, zoom);

    $("lon").textContent = `${lng.toFixed(3)}°`;
    $("lat").textContent = `${lat.toFixed(3)}°`;
    $("tuile").textContent = `${zoom}/${t.x}/${t.y}`;

    // Dans le repère Étoile, la latitude EST l'angle d'élévation de l'étoile.
    // Ce n'est pas une approximation : c'est la définition du repère.
    $("soleil").textContent = `${lat.toFixed(2)}°`;

    // `queryTerrainElevation` rend 0 — et non `null` — quand aucun relief
    // n'est monté, ce qui affichait un « 0 m » trompeur au lieu de dire que
    // la mesure n'est pas disponible. On interroge donc l'état du relief.
    const releve = map.getTerrain && map.getTerrain()
      ? map.queryTerrainElevation(e.lngLat) : null;
    $("alt").textContent = (releve === null || releve === undefined)
      ? "— (relief 3D éteint)" : `${Math.round(releve)} m`;
  });

  map.on("error", (e) => {
    // Hors de la bande, au-delà de split_zoom, les tuiles n'existent pas : le
    // 404 est attendu et MapLibre retombe sur la tuile parente. On ne le
    // signale donc pas comme une panne.
    const msg = e && e.error ? e.error.message : "";
    if (/40[34]/.test(msg)) return;
    $("erreur").textContent = msg || "erreur MapLibre";
  });
}
</script>
</body>
</html>
