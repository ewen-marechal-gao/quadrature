# ÉTALON DE BANC D'ESSAI — pas une créature du bestiaire.
#
# Le « Sac de frappe » mesure l'OFFENSE d'un gabarit : combien de cases ▢ il
# parvient à cocher par manche. Tout ce qui n'est pas cette mesure est neutralisé
# — le mannequin est une CONSTANTE, pas un adversaire :
#
#   • il ne rend jamais un coup (deck vide, ⚫ 0) : le débit lu est le plafond du
#     gabarit, non un compromis survie/dégâts ;
#   • il ne meurt jamais : chaque run va au bout du compteur de manches, donc le
#     dénominateur est identique pour tous. Un mannequin mortel avantagerait les
#     builds à gros pic, qui l'achèveraient plus tôt et se verraient créditer
#     d'un « par manche » flatteur.
#
# ── LA CASE ▢ EST L'UNITÉ DE MESURE, ET LA TAILLE DES BLOCS EN EST LE PRIX ────
# C'est le point le plus important de cette fiche. On ne convertit RIEN : on
# compte les cases effectivement cochées sur la cible. Or les trois vecteurs de
# dégâts y aboutissent déjà, chacun à son juste prix, sans qu'on ait à décréter
# un taux de change :
#   · une blessure légère 💢 coche une case ;
#   · une blessure grave 💔 DÉTRUIT un bloc — donc coche toutes ses cases ;
#   · cinq brûlures 🔥 se retirent pour poser un embrasement ❤️‍🔥, qui détruit un
#     bloc en se déclarant puis en rallume une de plus à chaque fin de manche ;
#   · l'hémorragie 🩸 coche une case par manche.
#
# Le mannequin n'a AUCUNE action, donc aucune parade au feu : il mesure la branche
# « créature vulnérable au feu » (§ combustion), qui est la branche pertinente pour
# jauger l'offense d'un mage. Ce n'est pas un verdict sur ce que la combustion fait
# à une cible capable d'étouffer les flammes.
#
# La conséquence est qu'un bloc PROFOND rendrait une 💔 démesurée : sur des blocs
# de 60 cases, une seule blessure grave vaudrait soixante coups légers. On calque
# donc l'anatomie réelle : les créatures du bestiaire ont des blocs de 2 à 4
# cases (le Faucheur : 2, 2, 3, 2, 3, 4, 2, 3, 2, 2). On retient 3, le mode et la
# médiane — ce qui situe une 💔 à ≈ 3 💢, le bas de la fourchette de conception.
# Changer ce 3 change le prix relatif des blessures graves pour TOUT le banc :
# c'est le bouton de calibrage, et il est ici, pas dans le code.
#
# 60 blocs, soit 180 cases : il en faut assez pour que le mannequin ne soit
# jamais détruit, mais SURTOUT pour qu'aucun dégât ne déborde — le trop-plein
# d'un bloc plein est PERDU (fillBlocks), et une saturation sous-compterait
# silencieusement les gabarits les plus violents. Le banc vérifie à chaque
# passage qu'on est resté loin de cette limite.
#
# Sa garde 8 est LE seuil de référence du banc. La déplacer change l'échelle de
# tous les débits à la fois : on la bouge pour recalibrer, jamais au cas par cas.
id: training-dummy
name:
  fr: Sac de frappe
  en: Punching Bag
power: initiate
# Jamais lancés (aucune carte) — présents parce que le schéma d'une fiche l'exige.
dice:
  - threat
  - threat
  - threat
  - threat
description:
  fr: >-
    Mannequin d'entraînement de la salle d'armes : un tronc de bois gainé de
    toile, lesté de sable, qui encaisse sans jamais rendre un coup. Étalon de
    mesure, pas créature.
guard:
  # `type` est un libellé d'affichage : seule `value` fixe le seuil à atteindre.
  type: block
  value: 8
speed:
  walk: 0
  run: 0
# Horloge de fatigue hors d'atteinte : le mannequin ne tombe jamais d'épuisement.
fatigue: 9999
# ⚫ 0 — il ne joue aucune carte, même s'il en avait une.
actions: 0
parts:
  # UNE seule partie : la sélection de cible priorise les parties `offensive`,
  # donc découper le mannequin en plusieurs parties ne ferait que déplacer la
  # question de savoir laquelle encaisse. Une seule, et tout y atterrit.
  - type: body
    tag: support
    name:
      fr: Tronc
      en: Trunk
    description:
      fr: Bois gainé de toile, lesté de sable. Se marque, ne se brise pas.
    # Armure 0 : ce qui est infligé est ce qui est coché. Une armure fausserait
    # doublement la mesure — elle absorbe les 💔 et réduit les 💢.
    armor: 0
    blocks:
      - &pad
        cases: 3
        name:
          fr: Bourre
          en: Stuffing
        grants:
