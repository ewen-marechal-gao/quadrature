# ÉTALON DE BANC D'ESSAI — pas une créature du bestiaire.
#
# La « Sentinelle » mesure la RÉSISTANCE d'un gabarit : combien de manches il
# tient, et ce que ça lui coûte en 💔 et en 💧. Elle est l'exact symétrique du
# Sac de frappe — lui ne rend rien, elle ne fait que rendre :
#
#   • elle ne meurt jamais. C'est le cœur du dispositif : puisque le PJ ne peut
#     pas l'abattre, la fin du combat ne dépend QUE de sa capacité à encaisser.
#     Un mannequin tuable mesurerait un mélange d'offense et de défense ;
#   • elle frappe exactement UNE fois par manche (⚫ 1, carte à 1 ⚫) : la
#     pression est une constante, pas une variable. Aucun deck à arbitrer, donc
#     aucune heuristique d'IA ne s'interpose entre les gabarits comparés ;
#   • sa frappe est plate — pas de ⭐, pas de statut, pas de coût de fatigue :
#     une hémorragie ou une mise à terre aléatoire ajouterait de la variance qui
#     n'apprend rien sur le gabarit.
#
# ── Une seule partie, et c'est structurel ─────────────────────────────────────
# La sélection de cible en mêlée vise les parties `offensive` EN PREMIER. Donner
# à la Sentinelle un « bras de frappe » séparé serait donc un piège : le PJ le
# démolirait en priorité, la carte qu'il confère serait perdue, et la Sentinelle
# cesserait de frapper — la mesure s'effondrerait au moment précis où le gabarit
# encaisse le mieux. Tout tient donc dans UNE partie `support`.
#
# ── Blocs de 3 cases, comme le Sac de frappe ──────────────────────────────────
# Même barème, pour que les cases cochées SUR elle restent lisibles avec la même
# échelle (voir training-dummy.card.yaml, qui porte l'explication complète : une
# 💔 détruit un bloc, donc la profondeur d'un bloc EST le prix d'une blessure
# grave). 60 blocs = 180 cases, de quoi encaisser 20 manches sans jamais être
# détruite ni saturer.
#
# Calibrage de frappe : ⬜⬜⬜⬜ en disposition agressive = +1 rang, donc quatre
# dés 🟫 (2,3,3,4,4,5) sommés, moyenne ≈ 14 — la même pression qu'un Faucheur,
# la référence « initié » déjà éprouvée dans les duels existants.
id: training-sentinel
name:
  fr: Sentinelle d'entraînement
  en: Training Sentinel
power: initiate
dice:
  - threat
  - threat
  - threat
  - threat
description:
  fr: >-
    Automate d'armes de la salle d'entraînement : un bras articulé, lesté, qui
    frappe au même rythme jusqu'à ce que l'élève cède. Étalon de mesure, pas
    créature.
