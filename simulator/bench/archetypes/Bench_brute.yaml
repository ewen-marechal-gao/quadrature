# GABARIT DE BANC D'ESSAI — Brute (Escrime · Belliciste, épée large)
#
# ── La convention de budget, commune à tous les gabarits ──────────────────────
#   • 8 points de compétence, ni plus ni moins ;
#   • protection 🛡️ 1 ;
#   • aucun trait (les traits s'ouvrent aux rangs 3 et 5 : c'est une SECONDE
#     monnaie, qui fausserait la comparaison si un seul gabarit en portait) ;
#   • les rangs de discipline et les atouts sont une monnaie à part — dans les
#     règles un atout OUVRE un plafond, il ne s'achète pas en points.
#
# Les caractéristiques ne s'achètent jamais : elles se DÉRIVENT des rangs de
# compétence (base 1, +1 au rang 2, +1 de plus au rang 4). Les `value` ci-dessous
# sont un aide-lecture recalculé au chargement, pas une entrée.
#
# ── Ce gabarit ────────────────────────────────────────────────────────────────
# La Forme la plus offensive de l'Escrime, montée sur le châssis le plus lourd.
# Puissance 3 porte l'Attaque armée ET la Frappe brutale ; Robustesse 2 ouvre le
# Blocage. Tout est concentré sur la ligne de Force — aucun point en Précision,
# donc la Frappe vive lui reste fermée.
#
# ♾️ Attaques acharnées (branché) : démarre Agressif, et gagne 1 ⚡ à CHAQUE
# attaque de mêlée réussie tant qu'il reste Agressif. C'est le vrai moteur du
# profil, et il est atypique : la Brute n'achète qu'une seule ⚡ en Réactivité,
# mais sa Forme lui en rend une par coup porté. Sa capacité à se défendre est
# donc un SOUS-PRODUIT de son agressivité — ce que le banc doit rendre visible.
#
# Les riders d'issue par catégorie d'arme (Estafilades / Entailles / Empaler) ne
# sont PAS branchés : l'épée large ne change donc rien mécaniquement ici
# aujourd'hui. Elle est déclarée pour que la fiche dise le build en entier, et
# pour que le jour où les riders seront câblés le gabarit en profite sans retouche.
name: "Bench Brute"
disciplines:
  fencing: 1
perks:
  - warmonger
skillTags:
  - favweapon-broad
inventory:
  protection: 1
characteristics:
  strength:
    value: 3          # dérivé — satisfait le prérequis du Belliciste (Force 2)
    wounds: 0
    power: 3          # Attaque armée + Frappe brutale (prérequis rang 1)
    robustness: 2     # ouvre le Blocage (rang 2)
  agility:
    value: 1
    wounds: 0
    precision: 0      # nulle : la Frappe vive lui est fermée, c'est assumé
    mobility: 0
  vigor:
    value: 2
    wounds: 0
    endurance: 2
    recovery: 0
  grace:
    value: 1
    wounds: 0
    composure: 0
    disguise: 0
  acuity:
    value: 1
    wounds: 0
    observation: 0
    vigilance: 0
  willpower:
    value: 1
    wounds: 0
    authority: 0
    discipline: 0
  intelligence:
    value: 1
    wounds: 0
    logic: 0
    reactivity: 1     # ⚡ 1 acheté — sa Forme lui en rend une par coup réussi
  tenacity:
    value: 1
    wounds: 0
    conviction: 0
    resilience: 0
  charisma:
    value: 1
    wounds: 0
    eloquence: 0
    manipulation: 0
  lucidity:
    value: 1
    wounds: 0
    foresight: 0
    intuition: 0
