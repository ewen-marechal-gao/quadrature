name: "Finesse Fencer"
# Escrime — Forme Fine Lame (§ martial_escrime.md). Arme de prédilection : lames
# légères → sharp-strike (Frappe vive) roule en Escrime au lieu de Précision (neutre
# tant qu'Escrime = Précision = 1). ♾️ Formes parfaites : démarre Concentré (+1⚡/manche)
# et gagne 1⚡ sur une Frappe vive réussie sans Défaut.
# Profil ESQUIVE : la Vigilance (Parade) ne sert pas son style — points basculés
# en Réactivité (réserve de ⚡) ; elle joue Préparation (+3⚡) pour multiplier les
# Esquives (Agilité + Mobilité).
