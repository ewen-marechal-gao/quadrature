# Profil SENTINELLE — bâti pour les réactions ⚡ (banc d'essai des déclencheurs).
#
# Là où le Précis a Réactivité 0 (ses ⚡ ne viennent que du bonus « concentré »),
# la Sentinelle investit dans la Réactivité : elle a des ⚡ à dépenser ET le jet
# qui va avec (Frappe opportuniste = Réactivité 🟨🟨 + Intelligence 🟦). C'est le
# personnage qui rend le déclencheur « déplacement initié » réellement payant.
#
# TRAIT — Opportunisme (Précision, rang 3) : sa Frappe vive devient jouable en
# Réaction ⚡💧 sur le même déclencheur. Elle frappe donc avec son MEILLEUR jet
# (Précision 🟨🟨🟨 + Agilité) au lieu du jet de Réactivité de la Frappe
# opportuniste — et garde la Frappe vive dans son plan de manche : le trait
# AJOUTE un mode, il n'enlève rien.
name: "Reactive Sentinel"
traits: [opportunisme]
inventory:
  protection: 1
characteristics:
  strength:
    value: 1
    wounds: 0
    power: 0
    robustness: 0
  agility:
    value: 2          # dérivé : precision 3 → un seul jalon (rang 2) franchi
    wounds: 0
    precision: 3      # rang 3 : ouvre un emplacement de trait → Opportunisme
    mobility: 1
  vigor:
    value: 2          # dérivé : endurance 2 → rang 2
    wounds: 0
    endurance: 2
    recovery: 1
  grace:
    value: 1
    wounds: 0
    composure: 0
    disguise: 0
  acuity:
    value: 1
    wounds: 0
    observation: 0
    vigilance: 1
  willpower:
    value: 1
    wounds: 0
    authority: 0
    discipline: 1
  intelligence:
    value: 2          # dérivé : reactivity 2 → rang 2 (le 🟦 de la Frappe opportuniste)
    wounds: 0
    logic: 0
    reactivity: 2     # 2 ⚡ par manche, et les 🟨🟨 du jet de réaction
  tenacity:
    value: 1
    wounds: 0
    conviction: 0
    resilience: 0
  charisma:
    value: 1
    wounds: 0
    eloquence: 0
    manipulation: 0
  lucidity:
    value: 1
    wounds: 0
    foresight: 0
    intuition: 0
