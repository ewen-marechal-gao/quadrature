# Premier duel mixte : un personnage-joueur contre une créature du bestiaire.
# L'adversaire est charge depuis data/bestiary/cards/faucheur.card.yaml”
# résolution asymétrique (4 dés sommés vs garde du PJ ; garde fixe Esquive 10
# quand le PJ attaque, dégats sur la partie du corps déclarée).
name: Duel — le Précis contre le Faucheur
description: >-
  En lisière de canopé, un duelliste croise un Faucheur en chasse.
  Premier test du moteur mixte personnage contre créature.
maxRounds: 30
factions:
  - name: Aventuriers
    characters:
      - sheet: characterSheets/Duelist_precise.yaml
        persona: opportunist
    # Bande II vide, faute d'attaque de Précision à ce palier (cf. chantier armes :
    # une rapière « finesse » porterait l'attaque armée sur Précision).
    # Mesuré : ajouter armed-attack ici fait bondir le PJ à 90,2% malgré 26,6% de
    # touche — les dégâts d'échec (1💢) rendent toute action rentable. Sonde
    # retirée : remplir la bande avec une action inadaptée est dégénéré.
    allowedActions: ["sharp-strike", "respiration", "stabilize", "preservation", "provocation"]

  - name: Faune d'Aeonir
    characters:
      - adversary: faucheur
    allowedActions: []
