# Banc d'essai des DÉCLENCHEURS ⚡ (§ defense_reactions.md).
#
# Mise en place : les deux combattants commencent AU CONTACT. Le tirailleur
# surclasse son adversaire en portée : sa politique de kiting va le pousser à
# décrocher (Course) dès la première bande utile. C'est exactement le déclencheur
# de la Frappe opportuniste — « une créature à portée initie une action de
# Marche, de Course ou de Posture » — que le duelliste, adjacent, doit saisir.
#
# Ce que ça vérifie : la fenêtre de réaction s'ouvre PENDANT la résolution, la
# réaction se résout AVANT le déplacement, et son coût en ⚡ la borne.
#
# ── Passe TRAITS (§ traits.md) ───────────────────────────────────────────────
# Les deux combattants portent désormais un mode réactif ⚒️ au lieu d'une action
# à déclencheur natif : la Sentinelle a **Opportunisme** (sa Frappe vive se joue
# en Réaction ⚡💧) et le tirailleur **Tir d'instinct** (son Tir rapide de même).
# Le banc teste donc les deux sens du même déclencheur : celui qui décroche se
# fait frapper, celui qui approche se fait tirer dessus.
name: Réaction — modes réactifs ⚒️ (Opportunisme / Tir d'instinct)
description: >-
  Un duelliste colle un tirailleur qui cherche à reprendre ses distances. Chaque
  décrochage lui offre une ouverture — s'il lui reste une réaction ⚡ à dépenser ;
  et chaque approche offre au tirailleur un tir de réaction.
maxRounds: 12

# Couloir COURT (mesuré) : le tirailleur court plus vite que le duelliste (8
# cases contre 6). Sur 24 cases il décroche longtemps et les fenêtres de réaction
# se raréfient (~2-4 par combat) ; acculé au bout d'un couloir de 14, il doit
# rompre au contact manche après manche (~2-6, dans les DEUX sens).
board: { width: 14, height: 5 }

factions:
  - name: Duellistes
    characters:
      # La Sentinelle a Réactivité 2 : des ⚡ à dépenser ET le jet qui va avec.
      # (Avec le Précis — Réactivité 0 — le planificateur REFUSE la réaction, à
      # juste titre : elle coûterait plus qu'elle ne rapporterait.)
      - sheet: characterSheets/Sentinel_reactive.yaml
        persona: opportunist
        pos: { x: 6, y: 2 }
    # Plus besoin d'inscrire une action de réaction dédiée : le trait Opportunisme
    # ajoute un MODE réactif à la Frappe vive, qui reste par ailleurs planifiable.
    allowedActions:
      ["sharp-strike", "armed-attack", "respiration", "stabilize", "walk", "course"]

  - name: Tirailleurs
    characters:
      - sheet: characterSheets/Ranged_instinctive.yaml
        persona: cautious          # veut survivre : il décrochera
        pos: { x: 7, y: 2 }
    allowedActions: ["quick-shot", "aimed-shot", "course", "walk", "respiration", "stabilize"]
