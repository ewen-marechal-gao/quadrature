# Quadrature — configuration nginx du conteneur statique.
# Montée sur /etc/nginx/conf.d/default.conf (cf. docker-compose.yml).
#
# TLS, HTTP/2 et la redirection http→https sont assurés par Traefik en amont :
# ce serveur ne voit que du HTTP en clair sur le réseau interne.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Le contenu est du texte à 90 % (HTML, CSS, JS, JSON de données) — les
    # images, elles, sont déjà compressées et n'y gagneraient rien.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml;

    # Export Next.js avec `trailingSlash: true` : chaque page est un dossier
    # contenant index.html. `$uri/` couvre le cas normal et laisse nginx émettre
    # la redirection 301 vers l'URL avec barre finale quand elle manque.
    location / {
        try_files $uri $uri/ =404;
    }

    # Les assets de Next portent un hash dans leur nom : à nom identique,
    # contenu identique. On peut donc les mettre en cache indéfiniment.
    location /_next/static/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}
