# Actions de personnage — SOURCE STRUCTURÉE du simulateur (chantier « unification
# des actions », étape 3a). Clés anglaises, chaînes en Locale { fr, en? }.
#
# Chaque action déclare ses métadonnées (coût, initiative, tags, jet) et soit :
#   - ses ISSUES déclaratives onSuccess/onFailure (+ onCritical/onFlaw ADDITIFS),
#     chacune { text: <Locale>, effect: [ops] } — grammaire d'ops partagée avec
#     les cartes d'adversaires (documentée dans data/adversary_actions.yaml) ;
#   - soit `resolver: <id>` — échappatoire pour les comportements singuliers
#     (montants dynamiques, effets inconditionnels), enregistré dans
#     simulator/src/combat/action-resolvers.ts (qui porte aussi le getDC).
#
# `reach` = portée du coup, en cases (1 = au contact). ⚠️ TEMPORAIRE : la portée
# d'un personnage vient de son ARME, pas de l'action — la même Attaque armée est
# à portée 1 avec une dague et 2 avec une hast. Codée en dur ici en attendant le
# chantier des armes (même raccourci que le jet de Puissance pour tous). Absente
# = non gâtée : les règles ne donnent pas de portée de voix pour les actions
# sociales, et l'inventer serait une décision de règles.
#
# `vaultCard` = id de la carte française rules/fr/cartes/*.yaml : sert au test
# de cohérence (coût/initiative/nom) en attendant la projection générée (3b).
# `description` = résumé tactique FR injecté dans les prompts des agents LLM.

actions:
  armed-attack:
    vaultCard: attaque-armee
    name: { fr: "Attaque armée" }
    description:
      {
        fr: "Frappe avec une arme. Succès : 3💢 sur la cible, Échec : 1💢. Critique : cible à terre 🔻. Défaut : +1💧 pour toi.",
      }
    initiative: 5
    cost: { actions: 2 }
    tags: [offensive, melee, physical, physicalDamage]
    reach: 1
    roll: { characteristic: strength, skill: power }
    onSuccess: { text: { fr: "Touché — 3💢" }, effect: [{ wound: 3 }] }
    onFailure: { text: { fr: "Égratigné — 1💢" }, effect: [{ wound: 1 }] }
    onCritical:
      {
        text: { fr: "Critique — cible à terre 🔻" },
        effect: [{ status: knockdown }],
      }
    onFlaw:
      {
        text: { fr: "Maladresse — attaquant +1💧" },
        effect: [{ selfFatigue: 1 }],
      }

  # Ne peut être encaissée — validité des gardes gérée côté GuardProvider (agent).
  unarmed-attack:
    vaultCard: attaque-mains-nues
    name: { fr: "Attaque à mains nues" }
    description:
      {
        fr: "Attaque rapide sans arme, inflige de la fatigue. Succès : 2💧 sur la cible, partiel : 1💧. Critique : cible sonnée 💫. Défaut : +1💧 pour toi. Ne peut être encaissée.",
      }
    initiative: 3
    cost: { actions: 2 }
    tags: [offensive, melee, physical, fatigueDamage]
    reach: 1
    roll: { characteristic: strength, skill: power }
    onSuccess: { text: { fr: "Touché — 2💧" }, effect: [{ fatigue: 2 }] }
    onFailure: { text: { fr: "Effleuré — 1💧" }, effect: [{ fatigue: 1 }] }
    onCritical:
      {
        text: { fr: "Critique — cible sonnée 💫" },
        effect: [{ status: stunned }],
      }
    onFlaw:
      {
        text: { fr: "Maladresse — attaquant +1💧" },
        effect: [{ selfFatigue: 1 }],
      }

  brutal-strike:
    vaultCard: frappe-brutale
    name: { fr: "Frappe brutale" }
    description:
      {
        fr: "Coup dévastateur à haut risque. Succès : 1💔 blessure grave, Échec : 2💢. Critique : cible sonnée 💫. Coûte 1💧 à toi en plus des PA.",
      }
    initiative: 8
    cost: { actions: 2, fatigue: 2 }
    tags: [offensive, melee, physical, physicalDamage]
    reach: 1
    prerequisite: { skill: power, minValue: 1 }
    roll: { characteristic: strength, skill: power }
    onSuccess:
      {
        text: { fr: "Touché — 1💔 blessure grave" },
        effect: [{ heavyWound: 1 }],
      }
    onFailure: { text: { fr: "Raté — 2💢" }, effect: [{ wound: 2 }] }
    onCritical:
      {
        text: { fr: "Critique — cible sonnée 💫" },
        effect: [{ status: stunned }],
      }

  sharp-strike:
    vaultCard: frappe-vive
    name: { fr: "Frappe vive" }
    description:
      {
        fr: "Attaque agile et précise. Succès : 2💢, Échec : 1💢. Critique : hémorragie 🩸 sur la cible. Défaut : +1💧 pour toi. Coûte 1💧 à toi en plus des PA.",
      }
    initiative: 3
    cost: { actions: 1, fatigue: 1 }
    tags: [offensive, melee, physical, physicalDamage]
    reach: 1
    prerequisite: { skill: precision, minValue: 1 }
    roll: { characteristic: agility, skill: precision }
    onSuccess: { text: { fr: "Touché — 2💢" }, effect: [{ wound: 2 }] }
    onFailure: { text: { fr: "Égratigné — 1💢" }, effect: [{ wound: 1 }] }
    onCritical:
      {
        text: { fr: "Critique — hémorragie 🩸" },
        effect: [{ status: hemorrhage }],
      }
    onFlaw:
      {
        text: { fr: "Maladresse — attaquant +1💧" },
        effect: [{ selfFatigue: 1 }],
      }

  # ── Attaques à distance (§ attribute_actions.md « Actions offensives (distance) ») ──
  # La PORTÉE est un choix de simulation (comme la portée 1 des attaques de mêlée) :
  # les règles ne chiffrent pas de distance de tir, et la vraie portée viendra de
  # l'arme équipée (chantier armes #18). En attendant, on pose des valeurs jouables
  # sur le tapis 34×22 — assez pour que le kiting ait un sens face à une Course (~8).
  # Non modélisés ici (⚒️/nuances) : « avantage 🟩 contre Parade », le mode réactif
  # du Tir rapide, la relance 🟦 du Tir ajusté.
  quick-shot:
    vaultCard: tir-rapide
    name: { fr: "Tir rapide", en: "Quick Shot" }
    description:
      {
        fr: "Tir d'instinct à distance. Succès : 2💢, Échec : 1💢. Critique : +1💢. Défaut : +1💧 pour toi. Coûte 1💧 en plus du PA. Portée 24 ; pas de tir au contact.",
        en: "Instinctive ranged shot. Hit: 2💢, miss: 1💢. Crit: +1💢. Flaw: +1💧 self. Range 24; no shot when engaged.",
      }
    initiative: 3
    cost: { actions: 1, fatigue: 1 }
    tags: [offensive, ranged, physical, physicalDamage]
    minRange: 1              # pas de tir si engagé (§ equipement — arc)
    effectiveRange: 24       # portée sans pénalité (future : dérivée de l'arme)
    prerequisite: { skill: intuition, minValue: 1 }
    roll: { characteristic: lucidity, skill: intuition }
    onSuccess: { text: { fr: "Touché — 2💢" }, effect: [{ wound: 2 }] }
    onFailure: { text: { fr: "Effleuré — 1💢" }, effect: [{ wound: 1 }] }
    onCritical: { text: { fr: "Critique — 1💢 de plus" }, effect: [{ wound: 1 }] }
    onFlaw:
      {
        text: { fr: "Tir précipité — attaquant +1💧" },
        effect: [{ selfFatigue: 1 }],
      }

  aimed-shot:
    vaultCard: tir-cible
    name: { fr: "Tir ciblé", en: "Aimed Shot" }
    description:
      {
        fr: "Tir ajusté et patient. Succès : 1💔 blessure grave, Échec : 2💢. Critique : hémorragie 🩸. Défaut : +1💧 pour toi. Coûte 1💧 en plus des PA. Portée 24 ; pas de tir au contact.",
        en: "Patient aimed shot. Hit: 1💔, miss: 2💢. Crit: hemorrhage 🩸. Flaw: +1💧 self. Range 24; no shot when engaged.",
      }
    # 7 = la valeur de la carte du vault (tir-cible). Le moteur portait 8 : la
    # divergence a vécu tant que le test de cohérence ne voyait pas cette action.
    initiative: 7
    cost: { actions: 2, fatigue: 1 }
    tags: [offensive, ranged, physical, physicalDamage]
    minRange: 1              # pas de tir si engagé (§ equipement — arc)
    effectiveRange: 24       # portée sans pénalité (future : dérivée de l'arme)
    prerequisite: { skill: observation, minValue: 1 }
    roll: { characteristic: acuity, skill: observation }
    onSuccess: { text: { fr: "Touché — 1💔 blessure grave" }, effect: [{ heavyWound: 1 }] }
    onFailure: { text: { fr: "Manqué — 2💢" }, effect: [{ wound: 2 }] }
    onCritical: { text: { fr: "Critique — hémorragie 🩸" }, effect: [{ status: hemorrhage }] }
    onFlaw:
      {
        text: { fr: "Tir gâché — attaquant +1💧" },
        effect: [{ selfFatigue: 1 }],
      }

  respiration:
    vaultCard: respiration
    name: { fr: "Respiration" }
    description:
      {
        fr: "Régulation du souffle (première action uniquement). Retire Essoufflé 💨 toujours. Succès : retire (1 + Endurance)💧. Critique : +1💧 bonus. Échec : retire 1💧. Défaut : perd 1 PA. DD = fatigue actuelle.",
      }
    initiative: 1
    cost: { actions: 1 }
    tags: [support, healing, physical]
    prerequisite: { skill: endurance, minValue: 1 }
    requiresFirstAction: true
    roll: { characteristic: vigor, skill: endurance }
    selfTargeted: true
    resolver: respiration
    clearsStatus: winded    # le planificateur sait qu'une Respiration lève l'essoufflement

  stabilize:
    vaultCard: stabiliser
    name: { fr: "Stabiliser" }
    description:
      {
        fr: "Premiers soins (première action uniquement). Retire Hémorragie 🩸 toujours. Succès : soigne (1 + Récupération)💢. Critique : +1 ◇. Échec : soigne 1💢. Défaut : hémorragie résolue immédiatement (1💢). DD = 8 + blessures graves.",
      }
    initiative: 1
    # 1💧 : soigner sous le feu épuise. Auto-limite le sustain — répété, le soin
    # gonfle la fatigue jusqu'au test d'Endurance, là où un usage ponctuel ne coûte rien.
    cost: { actions: 1, fatigue: 1 }
    tags: [support, healing, physical]
    prerequisite: { skill: recovery, minValue: 1 }
    requiresFirstAction: true
    roll: { characteristic: vigor, skill: recovery }
    selfTargeted: true
    resolver: stabilize

  # ── Consolidation mentale (§ attribute_actions.md) ──────────────────────────
  # Tronc commun : 🟢 (première action), DD = 8 + degré d'état mental,
  # ✅/❌ regagnent du ◇, ⚠️ Défaut = −1 PA. Variantes ⚒️ différées.

  preservation:
    vaultCard: preservation
    name: { fr: "Préservation" }
    description:
      {
        fr: "Vous bridez vos émotions (concentré ou état colérique). Succès : 🔻 vers Prudent (jamais en dessous) et +1 ◇. Partiel : +1 ◇. Critique : 🔻 supplémentaire. Défaut : perd 1 PA. DD = 8 + degré mental.",
      }
    initiative: 1
    cost: { actions: 1 }
    tags: [support, mental, enhancement]
    prerequisite: { skill: discipline, minValue: 1 }
    mentalConditions: [enraged, furious, aggressive, focused] # concentré ou colère
    requiresFirstAction: true
    roll: { characteristic: willpower, skill: discipline }
    selfTargeted: true
    resolver: preservation

  focalisation:
    vaultCard: focalisation
    name: { fr: "Focalisation" }
    description:
      {
        fr: "Vous retrouvez votre clarté d'esprit. Succès : déplacement vers Concentré et +1 ◇. Partiel : +1 ◇. Critique : déplacement supplémentaire vers Concentré. Défaut : perd 1 PA. DD = 8 + degré mental.",
      }
    initiative: 1
    cost: { actions: 1 }
    tags: [support, mental, enhancement]
    prerequisite: { skill: logic, minValue: 1 }
    requiresFirstAction: true
    roll: { characteristic: intelligence, skill: logic }
    selfTargeted: true
    resolver: focalisation

  resolution:
    vaultCard: resolution
    name: { fr: "Résolution" }
    description:
      {
        fr: "Vous transformez la peur en détermination (concentré ou état craintif). Succès : 🔺 vers Agressif (jamais au-dessus) et +1 ◇. Partiel : +1 ◇. Critique : 🔺 supplémentaire. Défaut : perd 1 PA. DD = 8 + degré mental.",
      }
    initiative: 1
    cost: { actions: 1 }
    tags: [support, mental, enhancement]
    prerequisite: { skill: conviction, minValue: 1 }
    mentalConditions: [focused, cautious, panicked, terrified] # concentré ou crainte
    requiresFirstAction: true
    roll: { characteristic: tenacity, skill: conviction }
    selfTargeted: true
    resolver: resolution

  meditation:
    vaultCard: meditation
    name: { fr: "Méditation" }
    description:
      {
        fr: "Vous videz votre esprit (uniquement concentré). Succès : +1 ◇ par point de Résilience. Partiel : +1 ◇. Défaut : perd 1 PA. DD = 8 + degré mental.",
      }
    initiative: 1
    cost: { actions: 1 }
    tags: [support, mental, enhancement]
    prerequisite: { skill: resilience, minValue: 1 }
    mentalConditions: [focused]
    requiresFirstAction: true
    roll: { characteristic: tenacity, skill: resilience }
    selfTargeted: true
    resolver: meditation

  # ── Actions sociales (poussent l'état mental de la CIBLE) ────────────────────
  # Contestent la garde de la créature ; l'effet 🔺/🔻 est ensuite tamponné par
  # son ◇ (Ténacité). Leviers pour rechercher les états extrêmes d'une créature
  # (Provocation → Enragé : garde −2 ; Intimidation → Paniqué : menace −2⬇).

  provocation:
    vaultCard: provocation
    name: { fr: "Provocation" }
    description: { fr: "Vous raillez la cible pour l'enrager. Assèche son ◇ : succès → −1 ◇ + Déstabilisé (saute son prochain regain de ◇), critique → −1 ◇ de plus, échec → −1 ◇. Quand la cible n'a plus de ◇, elle subit 🔺 (vers la Colère). Coûte 2 PA." }
    initiative: 7
    cost: { actions: 2 }
    tags: [offensive, social, mental, mentalDamage]
    prerequisite: { skill: manipulation, minValue: 1 }
    roll: { characteristic: charisma, skill: manipulation }
    onSuccess:  { text: { fr: "La cible perd 1 ◇ et est Déstabilisée" }, effect: [{ shiftIfBroken: 1 }, { drainStability: 1 }, { destabilize: true }] }
    onFailure:  { text: { fr: "La cible perd 1 ◇" },                     effect: [{ shiftIfBroken: 1 }, { drainStability: 1 }] }
    onCritical: { text: { fr: "Critique — la cible perd 1 ◇ de plus" }, effect: [{ drainStability: 1 }] }

  intimidation:
    vaultCard: intimidation
    name: { fr: "Intimidation" }
    description: { fr: "Vous menacez la cible pour l'effrayer. Assèche son ◇ : succès → −1 ◇ + Déstabilisé (saute son prochain regain de ◇), critique → −1 ◇ de plus, échec → −1 ◇. Quand la cible n'a plus de ◇, elle subit 🔻 (vers la Peur). Coûte 2 PA." }
    initiative: 5
    cost: { actions: 2 }
    tags: [offensive, social, mental, mentalDamage]
    prerequisite: { skill: authority, minValue: 1 }
    roll: { characteristic: willpower, skill: authority }
    onSuccess:  { text: { fr: "La cible perd 1 ◇ et est Déstabilisée" }, effect: [{ shiftIfBroken: -1 }, { drainStability: 1 }, { destabilize: true }] }
    onFailure:  { text: { fr: "La cible perd 1 ◇" },                     effect: [{ shiftIfBroken: -1 }, { drainStability: 1 }] }
    onCritical: { text: { fr: "Critique — la cible perd 1 ◇ de plus" }, effect: [{ drainStability: 1 }] }

  # ── Réactions ⚡ (§ defense_reactions.md) ────────────────────────────────────
  # Une action porteuse d'un `trigger` n'entre JAMAIS dans le plan de manche : elle
  # est proposée à son porteur quand l'événement survient (cf. combat/triggers.ts),
  # se résout immédiatement, puis la bande reprend. Son coût est en ⚡ (pas en ⚫).
  #
  # Non implémentés ici (conditionnés par un TRAIT, système absent) : les « modes
  # réactifs » ⚒️ Opportunisme (Frappe vive), Tir d'instinct (Tir rapide),
  # Agripper (Saisir), Coagulation rapide (Stabiliser).

  opportunity-strike:
    vaultCard: frappe-opportuniste
    name: { fr: "Frappe opportuniste" }
    description:
      {
        fr: "Réaction ⚡ : frappe une créature adjacente qui initie un Déplacement. Succès : 2💢, Échec : 1💧 sur la cible. Critique : 🔻 sur la cible.",
      }
    initiative: 2
    cost: { actions: 0, reactions: 1, fatigue: 1 }
    tags: [offensive, melee, physical, physicalDamage]
    reach: 1
    trigger: { on: movement-initiated, scope: adjacent }
    roll: { characteristic: intelligence, skill: reactivity }
    onSuccess: { text: { fr: "Touché — 2💢" }, effect: [{ wound: 2 }] }
    onFailure: { text: { fr: "Manqué — la cible se fatigue 1💧" }, effect: [{ fatigue: 1 }] }
    onCritical: { text: { fr: "Critique — la cible subit 🔻" }, effect: [{ mental: -1 }] }

  # ── Déplacement (§ positions) ────────────────────────────────────────────────
  # La carte Déplacement porte deux actions moteur : Marche (base) et Course
  # (option). Sans jet — franchir du terrain ne se rate pas. `movement: true` les
  # route vers la branche dédiée de resolvePlans (ni garde ni jet d'attaque) :
  # elles visent la case de l'ennemi sans l'attaquer, posent l'Inertie ➡️, et la
  # Course s'essouffle. Le budget de Course est dérivé : 5 + Mobilité.

  walk:
    vaultCard: deplacement          # l'action de base de la carte (pas d'option)
    name: { fr: "Déplacement" }
    description: { fr: "Marche : avance de 3 cases sans jet, pose Inertie ➡️ 2. Bande II." }
    initiative: 4
    cost: { actions: 1 }
    tags: [movement, physical]
    movement: true
    moveBudget: 3
    grantsInertia: 2
    blockedByStatus: [knockdown, entrapped]

  course:
    vaultCard: deplacement
    vaultOption: course
    name: { fr: "Course" }
    description: { fr: "Course : avance de 5 + Mobilité cases sans jet, pose Inertie ➡️ 3. Bande II." }
    initiative: 6
    cost: { actions: 1, fatigue: 1 }
    tags: [movement, physical]
    movement: true
    moveBudget: { base: 5, addSkill: mobility }
    grantsInertia: 3
    # Essoufflement retiré de la Course (test d'équilibrage — jugé trop punitif,
    # il forçait une Respiration entre deux Courses et cassait le kiting soutenu).
    # L'Essoufflé ne vient plus que de l'échec au test d'Endurance (fatigue ≥ 10).
    blockedByStatus: [winded, knockdown, kneeling, entrapped]

  # ── Charge (§ attribute_actions) ─────────────────────────────────────────────
  # Attaque de mêlée qui percute au bout de l'élan. Exige Inertie ➡️ 3 (donc une
  # Course la manche même, Bande II), la consomme (→ 0). Jet Mobilité + Agilité,
  # avec 🟩. 1💔 en succès / 2💢 en échec = la Frappe brutale du mobile.
  charge:
    vaultCard: charge
    name: { fr: "Charge" }
    description: { fr: "Charge : percute au bout de l'élan (exige Inertie ➡️ 3). Mobilité + Agilité 🟩. Succès : 1💔, Échec : 2💢. Bande III. Coûte 1💧." }
    initiative: 7
    cost: { actions: 1, fatigue: 1 }
    tags: [offensive, movement, melee, physical, physicalDamage]
    reach: 1
    requiresInertia: 3
    selfAdvantage: 1
    prerequisite: { skill: mobility, minValue: 1 }
    roll: { characteristic: agility, skill: mobility }
    onSuccess: { text: { fr: "Percute — 1💔" }, effect: [{ move: 6 }, { heavyWound: 1 }, { setInertia: 0 }] }
    onFailure: { text: { fr: "Manque l'élan — 2💢" }, effect: [{ move: 6 }, { wound: 2 }, { setInertia: 0 }] }
    onFlaw: { text: { fr: "Maladresse — +1💧" }, effect: [{ selfFatigue: 1 }] }
