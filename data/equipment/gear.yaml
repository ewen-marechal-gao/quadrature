# 🎒 Conteneurs, consommables et divers — source machine
#
# Projection des tableaux « Matériel » (Torse, Dos, Taille, Petits objets) de
# rules/fr/core/equipement.md.
#
# ── 🔸 et ▫️ ne sont pas deux tailles, mais deux ACCÈS ───────────────────────
# Les deux sont `size: small`. Ce qui les sépare vit dans le conteneur qui les
# fournit : `provides.accessible: true` = 🔸 poche, utilisable en combat au coût
# normal en PA ; `false` = ▫️ paquet, inaccessible tant qu'on n'a pas posé son
# arme et fouillé. Un même sachet de munitions est jouable dans un carquois de
# taille et dormant dans un grand carquois.
#
# ── Les porteurs d'armes ─────────────────────────────────────────────────────
# `carries: weapon` rend DÉGAINABLE une arme rangée dans la zone. Sans fourreau
# ni harnais, une arme au Dos est transportée, pas jouable : l'arc voyage
# décordé, l'épée de rechange est sanglée dans son paquetage. C'est la lecture
# littérale du vault (« Permet un accès à une arme en combat »), confirmée en
# arbitrage — et elle rend l'exemple de Lena du vault fautif (arc long au Dos
# sans harnais, mais elle tire) : à corriger dans la passe doc.
#
# ── Pas de champ `stock` sur les consommables ────────────────────────────────
# Le Stock du vault n'est pas une propriété de l'objet : c'est le nombre
# d'exemplaires identiques rangés dans l'inventaire. « Rations, Stock 3 » = trois
# rations occupant trois ▫️ — exactement ce que dit « 1 Point de Stock actuel =
# 🔸 ou ▫️ ». La jauge est émergente ; la stocker en double serait la première
# désynchronisation à venir. La rédaction du vault sera reprise en conséquence.

items:
  # ── Conteneurs : Torse ─────────────────────────────────────────────────────

  shoulder-satchel:
    kind: container
    vaultRow: Sacoche bandoulière
    name: { fr: "Sacoche bandoulière" }
