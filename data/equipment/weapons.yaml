# ⚔️ Armes — source machine
#
# Projection des tableaux « Famille d'armes » de rules/fr/core/equipement.md.
# Mêmes conventions que player_actions.yaml et guards.yaml : clés anglaises,
# chaînes Locale { fr, en? }, une entrée par ligne du vault.
#
# ── La PORTÉE est absolue ────────────────────────────────────────────────────
# Le vault note les armes d'allonge en « Allonge N » — un BONUS. On stocke la
# portée, en cases, 1 = au contact : Allonge 1 devient `reach: 2`. Une seule
# échelle, aucune addition silencieuse à faire en aval. Les tableaux du vault
# seront réécrits en « Portée » dans la passe doc.
#
# ── Ce que `attacks` veut dire ───────────────────────────────────────────────
# Le bandeau du vault : « une arme permettant les attaques vives donne accès à
# la Frappe vive ; toute arme tenue en main permet l'Attaque armée ». `attacks`
# est donc la liste des actions que l'arme OUVRE à son porteur — c'est elle qui
# remplace le `reach` codé sur l'action.
#
# ── Ce qui est branché, et ce qui ne l'est pas ───────────────────────────────
# `reach`, `minRange`, `attacks`, `canParry`, `slots`, `zones` sont LUS par le
# moteur. La colonne « Mécanique » est reportée verbatim dans `mechanic` mais
# n'est PAS appliquée : sa grammaire (relances conditionnelles, riders d'issue,
# modes ⛞) est le lot suivant. Une entrée avec `mechanic` et sans `grants` est
# une mécanique déclarée, pas jouée — et le test de cohérence le vérifie.
#
# ── Deux points d'INFÉRENCE, à confirmer ─────────────────────────────────────
#  1. Le tableau des armes d'allonge ne porte pas de colonne 🤲. On infère deux
#     mains, sauf Lance (« Utilisable à une main », donc le vault le précise
#     parce que c'est l'exception) et Javelot (arme de jet).
#  2. « Faucheur » est à la fois une arme d'allonge et une espèce du bestiaire
#     (data/bestiary/species/faucheur.yaml). L'id est `reaper-polearm` pour que
#     les deux registres ne se marchent pas dessus.

weapons:
  # ── Étalon de non-régression ───────────────────────────────────────────────
  # L'arme d'un personnage qui n'en déclare aucune. Elle reproduit EXACTEMENT le
  # comportement d'avant le modèle d'équipement : portée 1, toutes les attaques
  # de mêlée ouvertes, parade possible. Sans elle, introduire l'équipement
  # désarmerait toutes les fiches existantes d'un coup.
  generic-melee:
    name: { fr: "Arme de mêlée" }
    identity: { fr: "Générique" }
    family: long-blades
    slots: 1
    zones: [hands]
    reach: 1
    attacks: [armed, quick, powerful]
    canParry: true

  # Même rôle côté tir : reprend les valeurs de simulation d'avant le chantier
  # (portée 24 cases, pas de tir au contact). L'échelle de portée réelle des
  # arcs est un sujet de design ouvert — les quatre arcs du vault attendent.
  generic-bow:
    name: { fr: "Arc" }
    identity: { fr: "Générique" }
    family: bows
    # Le tableau des arcs ne porte pas de colonne 🤲 ; l'exemple travaillé du
    # vault range « l'arc long en bandoulière » sur 1 🔳. On suit l'exemple :
    # l'arc se tient à deux mains mais ne pèse qu'un emplacement.
    slots: 1
    zones: [hands, back]
    reach: 24
    minRange: 1
    attacks: [ranged-quick, ranged-aimed]
    canParry: false

  # ── Lames courtes ──────────────────────────────────────────────────────────
