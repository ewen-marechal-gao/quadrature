                                                                                  children:
                                                                                    - { uid: pondeurs-laitiers, tip: "Pondeurs laitiers", cd: "poilus à 6 pattes : pondent ET allaitent (œufs + lait — omelettes & fromage) ; bétail nourricier austral · réf. ornithorynque, échidné", status: todo, biome: S }
                                                                                    - uid: vivipares
