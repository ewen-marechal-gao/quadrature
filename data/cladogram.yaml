                                                                        - { uid: terrestres-aveugles, tip: "Terrestres aveugles", cd: "restent au sol ; radiation souterraine à venir", status: todo, biome: LC }
                                                                    - uid: visuels
                                                                      name: "VISUELS"
                                                                      ref: "œil vrai (formation d'image) : upgrade des taches photosensibles ; exploite la lumière du terminateur"
                                                                      mut: vision
                                                                      children:
                                                                        - uid: sauropsides
                                                                          name: "SAUROPSIDES"
