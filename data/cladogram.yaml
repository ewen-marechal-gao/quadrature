                                                        - { uid: tetrapodes-aquatiques, tip: "Tétrapodes aquatiques", cd: "branchies conservées, restés en eau · réf. Acanthostega †", status: todo, biome: NC }
                                                        - uid: osteides
                                                          name: "OSTÉIDES"
                                                          ref: "os vrai porteur : la gravité hors de l'eau impose un squelette ossifié (les aquatiques restent ferro-cartilagineux)"
