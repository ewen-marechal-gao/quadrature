# Cladogramme de la faune d'Aeonir — l'ARBRE (nœuds).
# Les mutations (label, description, kit de combat) vivent dans data/mutations.yaml, référencées par CLÉ (champ `mut`).
# Champs d'un nœud : uid ; name+ref (clade interne) | tip+cd (feuille) ; biome (NLCS) ; status (done|todo) ; mut (clé) ; star ; branchNote ; children.
# Édition via tools/cladogram.mjs.

title: "Arbre phylogénétique de la vie d'Aeonir — état courant (mis à jour à chaque grade peuplé)"
rootNote: "racine : hétérotrophe · électrosensible · sexuée (méiose)"

# Backlog d'idées (à développer plus tard ; non structuré dans l'arbre).
backlog:
  - "Migrateurs du LEVANT = milieu de JUNGLE → évolution divergente en formes de jungle."
  - "Migrateurs du COUCHANT = grandes STEPPES d'herbe pourpre → la forme terrestre se spécialise pour la vie au pâturage (brouteurs des steppes)."
  - "COUCHANT : une branche subit une ATROPHIE DES MEMBRES → convergence vers l'équivalent du Serpent (apode secondaire)."
  - "Hétérodontie (dents différenciées : incisives / canines / molaires) — grade mammifère, à poser vers les Synapsides."

root:
  children:
    - uid: pourpres
      name: "POURPRES"
      ref: "autotrophes — algues, plantes"
      mut: purpleEndosymbiosis
      children:
        - uid: sessiles-a-dispersion
          branchNote: "sessiles à dispersion"
          children:
            - { uid: pionniers-anemochores, tip: "Pionniers anémochores", cd: "herbe pourpre", status: done, biome: LC }
            - { uid: aeroplanctes, tip: "Aéroplanctes", cd: "flotteurs aériens", biome: NLC, mut: hydrogenSacs }
            - { uid: arbre-anneau, tip: "Arbre-Anneau", cd: "l'Arche — franchit la Nuit · réf. Pando", biome: NLC, star: true, mut: crystallization }
        - uid: refugiaux-polaires
          branchNote: "réfugiaux polaires"
          children:
            - { uid: endemiques-nord-marais, tip: "Endémiques Nord — marais", biome: N }
            - { uid: endemiques-sud-toundra, tip: "Endémiques Sud — toundra", biome: S }
        - { uid: phyterrants, tip: "Phyterrants", cd: "flore mobile · réf. Dionée, Euglène", biome: LC, mut: mobileFlora }
    - uid: zoides
      name: "ZOÏDES"
      ref: "animaux — Metazoa"
      children:
        - { uid: filtreurs, tip: "Filtreurs", cd: "Métazoïdes · réf. éponge", status: done, biome: NC }
        - uid: eumetazoides
          name: "EUMÉTAZOÏDES"
          ref: "cnidaire, ver…"
          mut: trueTissues
          children:
            - uid: radies
              name: "RADIÉS"
              ref: "méduse, hydre"
              children:
                - { uid: radies-2, tip: "Radiés", cd: "polypes & méduses", status: done, biome: NC }
                - { uid: trilateriens, tip: "Trilatériens", cd: "tri-radial · réf. Tribrachidium †", status: todo, biome: LC, mut: triradialSymmetry }
            - uid: vermiformes
              name: "VERMIFORMES"
              ref: "céphalisation : un AVANT nerveux + taches photosensibles (polarité A-P)"
              mut: cephalization
              children:
                - { uid: plats, tip: "Plats", cd: "vers plats : un avant + cerveau, mais intestin aveugle · réf. planaire", status: todo, biome: NC }
                - uid: enteriens
                  name: "ENTÉRIENS"
                  ref: "intestin traversant : bouche → broyage → absorption → anus ; alimentation continue et efficace"
                  mut: throughGut
                  children:
                    - { uid: les-vers, tip: "les Vers", cd: "fouisseurs / brouteurs à tube digestif traversant (sens unique)", status: done, biome: LC }
                    - uid: bilateriens
                      name: "BILATÉRIENS"
                      ref: "symétrie L/R (gauche-droite, appendices pairs)"
                      mut: bilateralSymmetry
                      children:
                        - { uid: vers-ronds, tip: "Vers ronds", cd: "tube digestif mais SANS circulation · réf. nématode", status: todo, biome: NC }
                        - uid: hemoferriques
                          name: "HÉMOFERRIQUES"
                          ref: "sang ferrique : cœur + vaisseaux, pigment respiratoire au fer → métabolisme et taille accrus ; fournit le fer routé par le Sidérotropisme"
                          mut: ferricCirculation
                          children:
                            - uid: exoferres
                              name: "EXOFERRES"
                              ref: "fer centrifuge → cortex/cuticule (cuirasse, coquille)"
                              mut: centrifugalSiderotropism
                              children:
                                - { uid: non-segmentes, tip: "Non-segmentés", cd: "pied musculeux · réf. mollusque", status: done, biome: NC }
                                - uid: segmentes
                                  name: "SEGMENTÉS"
                                  ref: "segments répétés"
                                  mut: metamerism
                                  children:
                                    - { uid: homonomes, tip: "Homonomes", cd: "mille-pattes · réf. Arthropleura †", status: done, biome: NLC }
                                    - { uid: arthropodes, tip: "ARTHROPODES", cd: "arthropodes tagmatisés, à mue · réf. trilobite †, insecte", status: done, biome: NLC, mut: moltingExoskeleton }
                            - uid: endoferres
                              name: "ENDOFERRES"
                              ref: "fer centripète → axe interne (corde dorsale ferrique)"
                              mut: centripetalSiderotropism
                              children:
                                - { uid: siderocordes, tip: "Sidérocordés", cd: "cordé mou basal : corde ferrique, fouisseur / nageur lent, sans queue propulsive · réf. amphioxus", status: done, biome: NC }
                                - uid: caudes
                                  name: "CAUDÉS"
                                  ref: "rame caudale post-anale → nage agile en eau (prérequis de l'endosquelette)"
                                  mut: tail
                                  children:
                                    - { uid: couteaux-ferriques, tip: "Couteaux ferriques", cd: "nageur souple électrique à longue queue ondulante, sans squelette · réf. poisson-couteau électrique", status: todo, biome: NC }
                                    - uid: endosquelette
                                      name: "ENDOSQUELETTE"
                                      ref: "petit nageur ondulant : vertèbres ferro-cartilagineuses + tête/crâne"
                                      mut: axialSkeleton
                                      children:
                                        - { uid: agnathes, tip: "Agnathes", cd: "sans mâchoire, anguilliformes · réf. lamproie, myxine", status: todo, biome: NC }
                                        - uid: hexapinnes
                                          name: "HEXAPINNÉS"
                                          ref: "3 paires de nageoires paires (= futurs membres)"
                                          mut: threeFinPairs
                                          children:
                                            - { uid: cuirasses-sans-machoire, tip: "Cuirassés sans mâchoire", cd: "à nageoires mais agnathes · réf. ostracodermes †", status: todo, biome: NC }
                                            - uid: gnathostomes
                                              name: "Gnathostomes"
                                              ref: "mâchoires + dents → préhension et mastication : prédation active"
                                              mut: jaws
                                              children:
                                                - { uid: machus, tip: "Mâchus", cd: "prédateurs aquatiques à squelette cartilagineux · réf. requins", status: todo, biome: NC }
                                                - uid: sarcopterygiens
                                                  name: "SARCOPTÉRYGIENS"
                                                  ref: "nageoires charnues / lobées → reptation des hauts-fonds"
                                                  mut: fleshyFins
                                                  children:
                                                    - { uid: lobes-aquatiques, tip: "Lobés aquatiques", cd: "lobés restés en eau · réf. cœlacanthe, dipneuste", status: todo, biome: NC }
                                                    - uid: membres
                                                      name: "MEMBRÉS"
                                                      ref: "membres porteurs : nageoires charnues → pattes ; tétrapode-souche encore aquatique · réf. Ichthyostega †"
