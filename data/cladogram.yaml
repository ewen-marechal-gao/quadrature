                                                                                - { uid: oiseaux, tip: "Oiseaux", cd: "2 paires d'ailes : 2 pattes + 4 ailes ; endothermie convergente", status: todo, biome: NLC, mut: secondWingPair }
                                                                        - uid: synapsides
                                                                          name: "SYNAPSIDES"
                                                                          ref: "endothermes (sang chaud) → lignée mammifère"
