                                                            - { uid: rampants-des-hauts-fonds, tip: "Rampants des hauts-fonds", cd: "os porteur mais branchies : rampent dans les vasières · réf. tétrapodes basaux †", status: todo, biome: NC }
                                                            - uid: amphibiens
                                                              name: "AMPHIBIENS"
                                                              ref: "poumons + peau respirante ; double vie"
