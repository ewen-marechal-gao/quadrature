    name:
      fr: Frappe faucheuse
    cost: ⚫⚫
    initiative: 4
    onFives:
      fr: "Repérez un 5 : la cible subit 🔻."
    onSuccess:
      fr: Inflige 💢💢💢
    onFailure:
      fr: Inflige 💢
    note:
      fr: Coût réduit à ⚫ tant que le bloc supérieur des Serpes est intact.
  - id: charge
    name:
      fr: Charge
    cost: ⚫
    initiative: 5
    onFives:
      fr: "Repérez deux 5 : la cible est Entravée 🕸️."
    onSuccess:
      fr: Déplacement [6] puis inflige 💢💢
    onFailure:
      fr: Déplacement [4]
