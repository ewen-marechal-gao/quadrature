# Source : data/bestiary/species/<id>.yaml ; parties/cartes/traits dérivés du cladogramme (via `from`).
id: faucheur
name:
  fr: Faucheur
  en: Reaper
power: initiate
dice:
  - threat
  - threat
  - threat
  - threat
description:
  fr: "Prédateur télépathe semi-dressé, cousin bestial des Peuples : il sent l'activité nerveuse de ses proies par ses aiguilles EM, puis lacère de ses deux longues serpes. Chasse en groupe, coordonné en silence."
guard:
  type: dodge
  value: 10
speed:
  walk: 4
  run: 8
fatigue: 9
appearance:
  fr: une longue queue · un corps vertébré à tête distincte · des mâchoires dentées · trois paires de membres porteurs (plan hexapode) · une fourrure dense · une silhouette quadrupède (deux paires de pattes) · des yeux frontaux au regard perçant · des pieds modulables adaptés au terrain · de longues aiguilles électromagnétiques dressées sur la nuque et le dos · un organe émetteur électromagnétique (télépathie) · un crâne bombé abritant un gros cerveau · une station bipède au dos incliné, les antérieurs libérés · un port à demi dressé, la queue faisant office de balancier · deux longues serpes recourbées au bout des avant-bras
parts:
  - type: head
    name:
      fr: Tête
    description:
      fr: Crâne allongé à léger museau, portant les sens et les centres nerveux.
    armor: 0
    blocks:
      - cases: 2
        grants:
          fr: +1 ◇ au début de la manche
  - type: body
    name:
      fr: Corps
    description:
      fr: Tronc musculeux logeant les viscères. Couvert d'une fourrure dense et isolante.
    armor: 1
    blocks:
      - cases: 3
        grants:
          fr: +1 🫁 au début de la manche
  - type: sickles
    name:
      fr: Serpes
    description:
      fr: "Deux longues faux (ongles allongés en lames recourbées) : l'arme maîtresse."
    armor: 0
    blocks:
      - cases: 3
        grants:
          fr: Frappe faucheuse coûte ⚫ (au lieu de ⚫⚫)
      - cases: 3
        grants:
          fr: Confère l'action Frappe faucheuse
  - type: rearLeg
    name:
      fr: Pattes
    description:
      fr: Paire de membres arrière, moteur principal du déplacement. Postérieurs puissants et ramassés, porteurs de la station bipède.
    armor: 1
    blocks:
      - cases: 2
        grants:
          fr: +1 action Charge
      - cases: 3
        grants:
          fr: Déplacement normal · Évasion 1
  - type: tail
    name:
      fr: Queue
    description:
      fr: Longue queue musclée. Queue devenue balancier terrestre.
    armor: 0
    blocks:
      - cases: 2
        grants:
          fr: "Queue-balancier : insensible au renversement (mise à terre)"
traits:
  - name:
      fr: Sanguinaire
    kind: passive
    effect:
      fr: Gagne 🟩 sur ses attaques si la cible a au moins une case ▢ cochée.
cards:
