parts:
  - type: head
    tag: support
    name:
      fr: Tête
    description:
      fr: Crâne allongé à léger museau, portant les sens et les centres nerveux. Crâne ossifié (protection accrue).
    armor: 1
    blocks:
      - cases: 2
        name:
          fr: Mâchoires
        grants:
          text:
            fr: Confère l'action Morsure
          grantsCard: bite
      - cases: 2
        name:
          fr: Cerveau
        grants:
          text:
            fr: +1 ◇ au début de la manche
          resource: stability
          amount: 1
  - type: body
    tag: support
    name:
      fr: Corps
    description:
      fr: Tronc musculeux logeant les viscères. Couvert d'une fourrure dense et isolante.
    armor: 1
    blocks:
      - cases: 3
        name:
          fr: Cœur
        grants:
          text:
            fr: +2 🫁 au début de la manche
          resource: endurance
          amount: 2
      - cases: 2
        name:
          fr: Poumons
        grants:
          text:
            fr: Confère l'action Cri
          grantsCard: cry
  - type: sickles
    tag: offensive
    name:
      fr: Serpes
    description:
      fr: "Deux longues faux (ongles allongés en lames recourbées) : l'arme maîtresse."
    armor: 1
    blocks:
