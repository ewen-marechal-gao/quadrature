# Source d'une fiche d'adversaire — Bandit du peuple des Cimes (Aeonis sapiens).
# SAPIENT : anatomie dérivée du cladogramme (mains, pas de queue…), mais ses attaques
# viennent de son ÉQUIPEMENT (weapons + extraCards), pas d'une mutation.
id: bandit-cimes
from: cimes                     # uid de la race Cimes dans data/cladogram.yaml
name: { fr: "Bandit des Cimes", en: "Peaks Bandit" }
power: initiate
dice: [threat, threat, threat, threat]
description:
  fr: >-
    Coupe-jarret du peuple des Cimes : embusqué dans la canopée, il décoche une
    flèche puis fond à l'épée. Sapient télépathe, il coordonne ses coups en silence.

guard: { type: parry, value: 11 }
# speed & fatigue : dérivés des mutations (membres / corps).
tenacity: 4 # 🧠 barre mentale (▢) ; explicite pour l'instant — dérivera du cladogramme (encéphalisation).

# Retraits : sapient armé qui coordonne EN SILENCE — pas de morsure ni de cri
# naturels (il frappe à l'épée et à l'arc, cf. weapons).
removeCards: [bite, cry]

# Armes / équipement (mécaniquement comme des parties : armure + blocs qui confèrent).
weapons:
  - type: sword
    tag: offensive
    name: { fr: "Épée" }
    description: { fr: "Lame d'acier ferrique." }
    armor: 1
    blocks:
      - { cases: 2, name: { fr: "Lame" }, grants: { text: { fr: "Confère l'action Coup d'épée" }, grantsCard: swordStrike } }
  - type: bow
    tag: offensive
    name: { fr: "Arc" }
    description: { fr: "Arc de chasse et carquois." }
    armor: 0
    blocks:
      - { cases: 1, name: { fr: "Corde" }, grants: { text: { fr: "Confère l'action Tir" }, grantsCard: bowShot } }

extraTraits:
  - name: { fr: "Grimpeur des Cimes" }
    kind: passive
    effect: { fr: "Se déplace librement en hauteur (troncs, parois, canopée) ; frappe volontiers en embuscade depuis les cimes." }
