# Source d'une fiche d'adversaire — Le Faucheur.
# Stats NON dérivées du cladogramme ; les parties du corps, cartes et traits sont
# DÉRIVÉS de l'ascendance (via `from`) par tools/consolidate-bestiary.mjs → cards/faucheur.card.yaml.
# Clés en anglais, chaînes en Locale { fr, en? }.
id: faucheur
from: faucheurs # uid du tip dans data/cladogram.yaml
name: { fr: "Faucheur", en: "Reaper" }
power: initiate
dice: [threat, threat, threat, threat]
art: faucheur.png # illustration du verso (data/bestiary/art/faucheur.png)
description:
  fr: >-
    Prédateur télépathe semi-dressé, cousin bestial des Peuples : il sent
    l'activité nerveuse de ses proies par ses aiguilles EM, puis lacère de ses
    deux longues serpes. Chasse en groupe, coordonné en silence.

guard: { type: dodge, value: 10 }
# speed & fatigue : dérivés des mutations (membres / corps) ; ajouter ici pour surcharger.
tenacity: 4 # 🧠 barre mentale (▢) ; explicite pour l'instant — dérivera du cladogramme (encéphalisation).

# Mutations supplémentaires (hors ascendance) : désormais VIDE. Morsure (jaws),
# Cri (lungs) et Balayage caudal (fur) sont conférés par l'ascendance. Le Cri
# « sidérant » (terrorShriek) attend la passe Télépathie ; la Morsure déchirante
# (predatoryBite) est réservée à un futur clade de prédateurs.
extraMutations: []

# Traits propres à l'espèce (non conférés par une mutation partagée).
# `id` : clé stable branchée dans le simulateur (adversary/traits.ts) — la prose reste l'affichage MJ.
extraTraits:
  - id: sanguinaire
    name: { fr: "Sanguinaire" }
    kind: passive
    effect:
      {
        fr: "Si la cible souffre d'au moins une hémorragie 🩸, gagne 🟩 sur ses actions infligeant des dégâts physiques.",
      }
