# ⚡ Électromancie (Electromancy) — discipline source (cartes)
#
# Projection de rules/fr/disciplines/magie_electromancie.md. Mêmes conventions
# que player_actions.yaml / fencing.yaml : clés ANGLAISES, chaînes Locale {fr,en}.
#
# ── État ────────────────────────────────────────────────────────────────────────
# Premier noyau jouable de la discipline : un cantrip (spark), un générateur
# auto-ciblé (cathodic-focus) et un exutoire (discharge). Ils exercent l'économie
# de charges (Phases B→C→D) : cathodic-focus pose une ⊖ garantie (onPlay, propagée
# et valorisée), discharge la convertit en dégâts.
#
# ── Fidélité / chantier ─────────────────────────────────────────────────────────
#  · Jet Électromancie 🟨 : proxy Volonté + Discipline (pas de discipline-as-roll).
#  · DD dynamique (Focalisation 7+charges, Décharge 7+X) : DD fixe pour l'instant.
#  · Modes ⛞ (sacrifice de dé), génération à X⊖ par niveau, condition « ≥1 ⊖ » de
#    la Décharge, temp-uncap de la Focalisation : chantier ultérieur.

discipline:
  id:   electromancy
  name: { fr: "Électromancie", en: "Electromancy" }
  cap:  4

perks:

  # Initiation à l'Électromancie — débloque le rang de discipline (jusqu'à 2).
  # Les cartes sont gatées par la POSSESSION de la discipline (canUseAction), pas
  # par un skillTag : ce perk n'a donc pas de grant mécanique, il ouvre le rang.
  arc-initiate:
    name: { fr: "Initiation à l'Électromancie", en: "Electromancy Initiation" }
    tier: 1
    disciplineCap: 2
    prereq:
      characteristics: { willpower: 2 }
    grants: []

actions:

  # Étincelle — cantrip (bande I). Brûle la cible ; ne génère PAS de charge
  # (§ design : la génération est l'affaire du tier 1). Critique : sème un ⊕.
  spark:
    name:        { fr: "Étincelle", en: "Spark" }
    description: { fr: "Un éclair fugace jaillit de votre doigt, enflammant la cible.",
                   en: "A fleeting spark leaps from your finger, setting the target alight." }
    initiative:  2
    cost:        { actions: 1 }
    tags:        [offensive, ranged]
    reach:       3
    roll:        { characteristic: willpower, skill: discipline }
    onCritical: { text: { fr: "la cible gagne une charge ⊕", en: "the target gains a ⊕ charge" },
                  effect: [{ charge: 1 }] }
    onSuccess:  { text: { fr: "2 Brûlures 🔥", en: "2 burns 🔥" }, effect: [{ burn: 2 }] }
    onFailure:  { text: { fr: "1 Brûlure 🔥", en: "1 burn 🔥" }, effect: [{ burn: 1 }] }

  # Focalisation Cathodique — générateur AUTO-CIBLÉ (bande I). onPlay pose une ⊖
  # garantie (propagée par le planner) ; le succès ajoute un ◇. DD fixe (proxy).
  cathodic-focus:
    name:         { fr: "Focalisation Cathodique", en: "Cathodic Focus" }
    description:  { fr: "L'air crépite : vous condensez une charge ⊖ sur vous-même.",
                    en: "The air crackles: you condense a ⊖ charge upon yourself." }
    initiative:   1
    cost:         { actions: 1 }
    tags:         [support, enhancement]
    selfTargeted: true
    selfDC:       7
    roll:         { characteristic: willpower, skill: discipline }
    onPlay:    { text: { fr: "vous accumulez une charge ⊖", en: "you accumulate a ⊖ charge" },
                 effect: [{ selfCharge: -1 }] }
    onSuccess: { text: { fr: "gagnez un Stabilité ◇", en: "gain a Stability ◇" },
                 effect: [{ gainStability: 1 }] }
    onFailure: { effect: [] }

  # Décharge Électrostatique — exutoire DYNAMIQUE (bande III). Resolver : libère
  # TOUTES les ⊖ portées (2💢/⊖ au succès, 1🔥/⊖ au partiel) — plus le lanceur est
  # chargé, plus elle frappe. `consumesCharge` signale l'exutoire au planificateur.
  discharge:
    name:          { fr: "Décharge Électrostatique", en: "Electrostatic Discharge" }
    description:   { fr: "Libère l'électricité accumulée en un éclair vers la cible.",
                     en: "Releases the stored charge as a bolt into the target." }
    initiative:    7
    cost:          { actions: 1 }
    tags:          [offensive, ranged]
    reach:         5
    roll:          { characteristic: willpower, skill: discipline }
    resolver:      discharge
    consumesCharge: true
