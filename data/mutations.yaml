# Mutations d'Aeonir — clé -> { label{Locale}, description{Locale}, addBiome?, removeBiome?, addHabitat?, removeHabitat?, kit? }.
# label/description = lore (i18n) ; kit = brique de fiche d'adversaire (cf. rules/fr/adversaires/regles_adversaires.md, connexion III).
# ÉCOLOGIE : add/removeBiome (north|dawn|dusk|south — dawn=Levant, dusk=Couchant) et add/removeHabitat
# (terrestrial|aquatic|aerial) sont repliés racine→feuille depuis la graine rootBiome/rootHabitat de
# data/cladogram.yaml. Ordre : remove PUIS add. Seules les mutations bougent l'écologie (héritage pur) —
# un clade porte donc l'aire POTENTIELLE de sa lignée. Rapport : node tools/cladogram.ts ecology
# Référencées par l'arbre (data/cladogram.yaml, champ `mut`) et par les fiches de bestiaire.
# Édition : `mut-*` (tools/cladogram.ts) fait un PATCH TEXTUEL chirurgical — SÛR, il préserve ces
# commentaires ET la mise en forme. Pour un kit riche (parties/blocs/grants), éditer à la main.
mutations:
  purpleEndosymbiosis:
    label:
      fr: Endosymbiose pourpre
    description:
      fr: "Capture et conservation d'un phototrophe au rétinal (microbe pourpre) : autotrophie dérivée ; définit les Pourpres, colore le vivant en bordeaux."
    # Se nourrir de lumière = suivre le terminateur ; la fixation gagne la terre ferme.
    addBiome: [dawn, dusk]
    addHabitat: [terrestrial]
  hydrogenSacs:
    label:
      fr: Sacs d'hydrogène
    description:
      fr: "Vésicules de flottaison : dispersion et flotteurs aériens portés par les vents."
    addHabitat: [aerial]
  crystallization:
    label:
      fr: Cristallisation (l'Arche)
    description:
      fr: L'Arbre-Anneau se cristallise pour franchir la Nuit et ferryer le vivant d'un terminateur à l'autre.
  mobileFlora:
    label:
      fr: Flore mobile / prédatrice
    description:
      fr: "Autotrophe ayant regagné la motilité (mixotrophe) : une « plante » qui marche ou chasse."
  triradialSymmetry:
    label:
      fr: Symétrie tri-radiale
    description:
      fr: "Trois axes à 120° : locomotion omnidirectionnelle, sans avant."
  neoteny:
    label:
      fr: Néoténie (vie & repro aquatiques)
    description:
      fr: "Maturité sexuelle conservée à l'état larvaire : vit et se reproduit comme un poisson (pédomorphose)."
    # Retour pleinement aquatique : la néoténie annule la conquête terrestre des Membrés.
    removeHabitat: [terrestrial]
  emEmitter:
    label:
      fr: Émetteur EM (télépathie active)
    description:
      fr: "Organe d'émission électromagnétique active : télépathie ; socle de la communication des Peuples."
    kit:
      body:
        fr: un organe émetteur électromagnétique (télépathie)
  chitinoFerricCarapace:
    label:
      fr: Carapace chitino-ferrique
    description:
      fr: "Armure dermique externe sur un corps déjà marcheur : blindé, lent, endurant."
    kit:
      body:
        fr: une lourde carapace dermique chitino-ferrique couvrant le dos et les flancs
      addParts:
        - type: carapace
          tag: defensive
          name:
            fr: Carapace
          description:
            fr: "Bouclier dermique chitino-ferrique sur le dos et les flancs : fait ricocher les coups légers."
          armor: 3
          blocks:
            - cases: 5
              name:
                fr: Plastron
              grants:
                text:
                  fr: Confère Blindage lourd
                armorAll: 2
                trait:
                  name:
                    fr: Blindage lourd
                  effect:
                    fr: "+2 🛡️ à toutes les autres parties (perdu si la carapace cède)"
      # Pattes massives du tank : les antérieures PIÉTINENT (bloc unique, plus d'évasion).
      # Après la fusion « Membres » → 3 blocs à 3 PV : Piétiner + Évasion (médianes) +
      # Évasion (postérieures) = +2 🍀. (Les 3 PV des médianes viennent de weightBearingLimbs.)
      modifyParts:
        - type: frontLeg
          blocksRemove:
            - 0
          blocksAdd:
            - cases: 3
              name:
                fr: Pattes antérieures
              grants:
                text:
                  fr: Confère l'action Piétiner
                grantsCard: trample
      speed:
        walk: 3
        run: 5
  threeFinPairs:
    label:
      fr: Trois paires de nageoires (plan hexapode)
    description:
      fr: "Trois paires d'appendices pairs propres à la lignée endosquelettique : socle des plans à six membres."
  centrifugalSiderotropism:
    label:
      fr: Sidérotropisme centrifuge (fer → cortex)
    description:
      fr: "Routage du fer vers la périphérie (cuirasse, coquille) : définit les Exoferres, écrantés à l'EM."
  centripetalSiderotropism:
    label:
      fr: Sidérotropisme centripète (corde dorsale)
    description:
      fr: "Routage du fer vers un axe interne (corde dorsale ferrique) : antenne EM, ossature axiale ; définit les Endoferres."
  faradayCage:
    label:
      fr: Cage de Faraday (résistance EM)
    description:
      fr: "Cuirasse ferrique écrantante (Exoferres) : sourd à l'EM, résistant à la télépathie. (différée)"
  bilateralSymmetry:
    label:
      fr: Symétrie bilatérale
    description:
      fr: "Symétrie gauche/droite, appendices pairs : corps orienté à mobilité dirigée."
    # La TÊTE (extrémité antérieure distincte, ciblable) apparaît ici → héritée par Vers ronds,
    # Exoferres ET Endoferres. axialSkeleton y ajoutera plus tard le système nerveux central.
    kit:
      body:
        fr: une tête distincte à l'avant
      addParts:
        - type: head
          tag: support
          name:
            fr: Tête
          description:
            fr: Extrémité antérieure distincte, portant les sens et la concentration nerveuse.
          armor: 0
          blocks: []
  metamerism:
    label:
      fr: Métamérie (segmentation)
    description:
      fr: "Le corps se répète en SEGMENTS spécialisés (avant / intermédiaire / arrière), chacun destructible séparément ; une chaîne nerveuse segmentaire les relie."
    kit:
      body:
        fr: un corps segmenté (avant · intermédiaire · arrière)
      # Le Corps hérité devient le SEGMENT AVANT (garde le Cœur ; type `body` conservé pour ne pas
      # casser les mutations aval qui le ciblent). On ajoute le segment intermédiaire (chaîne nerveuse
      # → ◇, le système nerveux non-cérébré) et le segment arrière (musculeux : agrippement/étreinte posés
      # plus tard par crawlingMuscles / raptorialLimbs).
      modifyPart:
        type: body
        name:
          fr: Segment avant
        descriptionAppend:
          fr: " Segment antérieur, portant le cœur."
      addParts:
        - type: segMedian
          tag: support
          name:
            fr: Segment intermédiaire
          description:
            fr: Segment médian, siège de la chaîne nerveuse segmentaire.
          armor: 0
          blocks:
            - cases: 2
              name:
                fr: Chaîne nerveuse
              grants:
                text:
                  fr: +1 ◇ au début de la manche (système nerveux non-cérébré)
                resource: stability
                amount: 1
        - type: segArriere
          tag: support
          name:
            fr: Segment arrière
          description:
            fr: Segment postérieur musculeux.
          armor: 0
          blocks: []
  # ── Montée Exoferre (aquatique → terrestre), chaîne causale : ailerons → mue → mandibules → trachées.
  #    Grade ③ (exosquelette sclérifié tagmatisé) DIFFÉRÉ : voir mineralizedExoskeleton plus bas.
  rigidFinlets:
    label:
      fr: Ailerons rigides
    description:
      fr: "Une paire d'ailerons rigides raidis au fer PAR SEGMENT : rames pour une nage rapide et manœuvrante — excellent nageur, dur à blesser gravement dans l'eau (Évasion élevée)."
    kit:
      body:
        fr: des ailerons rigides raidis au fer, un par segment
      # Un Aileron (+1 🍀 Évasion) sur CHAQUE segment → un corps à 3 segments nage à +3 Évasion ; perdre
      # un segment retire son aileron. À terre les ailerons ne portent plus (mécanique : cf. trait d'espèce).
      modifyParts:
        - type: body
          blocksAdd:
            - cases: 2
              name:
                fr: Aileron
              grants:
                text:
                  fr: "+1 🍀 Évasion (nage)"
                resource: evasion
                amount: 1
        - type: segMedian
          blocksAdd:
            - cases: 2
              name:
                fr: Aileron
              grants:
                text:
                  fr: "+1 🍀 Évasion (nage)"
                resource: evasion
                amount: 1
        - type: segArriere
          blocksAdd:
            - cases: 2
              name:
                fr: Aileron
              grants:
                text:
                  fr: "+1 🍀 Évasion (nage)"
                resource: evasion
                amount: 1
  molting:
    label:
      fr: Mue
    description:
      fr: "Abandon et régénération périodique des pièces rigides pour croître : conséquence directe des ailerons rigides, qui ne grandissent pas avec le corps."
    kit:
      body:
        fr: une cuticule renouvelée par mues successives
      traits:
        - name:
            fr: Mue
          kind: passive
          effect:
            fr: "Régénère ses pièces rigides en muant ; juste après une mue, son armure est réduite et il fuit le combat."
  mandibles:
    label:
      fr: Mandibules
    description:
      fr: "La tête arme des mandibules durcies : préhension et broyage — première prédation active de la lignée."
    kit:
      body:
        fr: des mandibules durcies
      modifyPart:
        type: head
        blocksAdd:
          - cases: 2
            name:
              fr: Mandibules
            grants:
              text:
                fr: Confère l'action Morsure
              grantsCard: bite
  airBreathing:
    label:
      fr: Respiration aérienne (trachées)
    description:
      fr: "Trachées : respire l'air. Se hisse brièvement sur la rive pour MUER à l'abri des prédateurs aquatiques ; incapable encore de se mouvoir à terre (masse trop lourde). Reste marine."
    # Respirer l'air ≠ sortir de l'eau : AUCUNE transition d'écologie (reste N aquatique). L'amphibie
    # vient après (crawlingMuscles), le terminateur plus tard encore (affranchissement de la ponte).
    kit:
      body:
        fr: une cuticule imperméable percée de stigmates trachéens
  crawlingMuscles:
    label:
      fr: Musculature reptante
    description:
      fr: "Musculature terrestre : le corps ondule et rampe hors de l'eau (reptation) → devient AMPHIBIE. Lente hors de l'eau ; encore liée aux marais du Nord pour pondre (repro inféodée à l'eau)."
    # AMPHIBIE : gagne terrestrial (garde aquatic), reste N (pas de terminateur tant que la ponte n'est pas affranchie).
    addHabitat: [terrestrial]
    kit:
      body:
        fr: une musculature reptante ondulante
      # Bloc « Étreinte » posé sur le SEGMENT ARRIÈRE musculeux (après l'Aileron → index 1) ; lateralBlades le remplace.
      modifyPart:
        type: segArriere
        blocksAdd:
          - cases: 3
            name:
              fr: Étreinte
            grants:
              text:
                fr: Confère l'action Constriction
              grantsCard: constriction
      speed:
        walk: 2
        run: 4
  lateralBlades:
    label:
      fr: Lames latérales
    description:
      fr: "Les scutes latéraux (ex-ailerons ferriques) s'affûtent en lames : l'étreinte ne broie plus, elle CISAILLE — la proie saigne (hémorragie) au lieu de s'épuiser (fatigue)."
    kit:
      body:
        fr: des scutes latéraux affûtés en lames tranchantes
      # Remplace le bloc « Étreinte » (constriction/fatigue, segment arrière, index 1 après l'Aileron)
      # par « Étreinte tranchante » (bladeConstriction/hémorragie). blocksAdd s'applique AVANT blocksRemove
      # (cf. applyKit) → l'add est poussé en fin, l'index 1 vise donc toujours l'Étreinte de base.
      modifyPart:
        type: segArriere
        blocksAdd:
          - cases: 3
            name:
              fr: Étreinte tranchante
            grants:
              text:
                fr: Confère l'action Constriction tranchante
              grantsCard: bladeConstriction
        blocksRemove:
          - 1
  broodMolt:
    label:
      fr: Nid de mue (poches amniotiques)
    description:
      fr: "Les œufs sont couvés dans des poches amniotiques ménagées dans la PEAU MUÉE, qui forme un nid clos et humide : la ponte s'affranchit de l'eau libre. La lignée peut alors essaimer le long du terminateur."
    # Affranchit la reproduction de l'eau — CONVERGENT de l'œuf amniote (Annulus) mais par la route
    # de la MUE (peau muée → nid) → ouvre le terminateur (dawn/dusk) au-delà des marais du Nord.
    addBiome: [dawn, dusk]
  # ── Lignée MARINE des Mandibulés (apex du Grand Marais, N aquatique) : chaîne causale
  #    benthique → ravisseur → cuirassé → colosse. Aucune transition d'écologie (reste N aquatique).
  benthicShift:
    label:
      fr: Bascule benthique
    description:
      fr: "Quitte le banc pélagique pour le fond vaseux : corps aplati, cryptique, tapi dans le limon. Embusqueur — c'est LE prédateur qui pousse les Trachéés à se hisser pour muer à l'abri."
    kit:
      body:
        fr: un corps aplati et cryptique, tapi dans le limon
      traits:
        - name:
            fr: Embuscade
          kind: passive
          effect:
            fr: "Enfoui dans la vase, indétectable tant qu'il n'a pas frappé : sa PREMIÈRE attaque du combat vise une cible surprise (garde ignorée)."
  raptorialLimbs:
    label:
      fr: Musculature ravisseuse
    description:
      fr: "Le SEGMENT ARRIÈRE se muscle en organe préhensile : le corps happe la proie à portée et l'enserre — de quoi la traîner au fond (pas de bras postiches : c'est le corps qui saisit)."
    kit:
      body:
        fr: un segment arrière musculeux et préhensile
      # L'agrippement vient des MUSCLES du segment arrière (après l'Aileron → index 1).
      modifyPart:
        type: segArriere
        blocksAdd:
          - cases: 3
            name:
              fr: Muscles ravisseurs
            grants:
              text:
                fr: Confère l'action Agrippement
              grantsCard: seize
      # La noyade utilise le poids du corps → action INNÉE (usable sur une cible déjà Entravée).
      grant_action: [dragUnder]
  sclerotizedPlates:
    label:
      fr: Plaques sclérifiées (cuirasse marine)
    description:
      fr: "Le sidérotropisme centrifuge paie enfin : des plaques dorsales chitino-ferriques cuirassent le grand embusqueur. Expression MARINE du fer (distincte de la tagmose terrestre différée)."
    kit:
      body:
        fr: des plaques dorsales chitino-ferriques
      # Le grand embusqueur cuirassé est de taille GRANDE (+1 case/bloc). Le colossal (engloutir,
      # briser, blessures graves) est un AUTRE registre → réservé à une créature dédiée, plus tard.
      size: grand
      modifyParts:
        - type: body
          armor_add: 2
          descriptionAppend:
            fr: " Cuirassé de plaques ferriques superposées."
        - type: segMedian
          armor_add: 2
        - type: segArriere
          armor_add: 2
        - type: head
          armor_add: 1
          descriptionAppend:
            fr: " Bouclier céphalique blindé."
  indeterminateGrowth:
    label:
      fr: Croissance indéfinie
    description:
      fr: "La mue autorise à grandir à chaque cycle ; devenu apex, plus rien ne l'arrête → gigantisme. La masse se traduit par l'ENCAISSEMENT (cases), pas par la puissance."
    kit:
      body:
        fr: une masse colossale, grandie mue après mue
      # Taille COLOSSALE → +3 cases par bloc (endurance à la blessure). Ni fatigue ni puissance :
      # l'expertise reste un levier d'équilibrage INDÉPENDANT de la taille (fixé sur la fiche).
      size: colossal
  # DIFFÉRÉE (hors arbre) : spécialisation TERRESTRE tardive — l'exosquelette sclérifié TAGMATISÉ
  # (Céphalon / Thorax / Abdomen). Se placera dans la radiation terrestre après la sortie de l'eau.
  # Les mandibules viennent de `mandibles`, la mobilité des Ailerons (à réconcilier en Pattes plus tard).
  mineralizedExoskeleton:
    label:
      fr: Exosquelette sclérifié (tagmose)
    description:
      fr: "Sclérification complète de la cuticule et tagmose : le corps se régionalise en Céphalon / Thorax / Abdomen cuirassés."
    kit:
      body:
        fr: un exosquelette sclérifié articulé en trois tagmes
      modifyParts:
        - type: head
          name:
            fr: Céphalon
          descriptionAppend:
            fr: " Capsule céphalique cuticulaire."
          blocksPrepend:
            - cases: 2
              name:
                fr: Carapace céphalique
              grants:
                text:
                  fr: "Cuticule ferrique à percer avant d'atteindre les organes du Céphalon."
        - type: body
          name:
            fr: Thorax
          descriptionAppend:
            fr: " Segment locomoteur cuirassé."
          blocksPrepend:
            - cases: 2
              name:
                fr: Carapace thoracique
              grants:
                text:
                  fr: "Cuticule ferrique à percer avant d'atteindre le cœur."
      addParts:
        - type: abdomen
          tag: support
          name:
            fr: Abdomen
          description:
            fr: Segment postérieur cuirassé, logeant viscères et stigmates respiratoires.
          armor: 0
          blocks:
            - cases: 2
              name:
                fr: Carapace abdominale
              grants:
                text:
                  fr: "Cuticule ferrique à percer avant d'atteindre les viscères."
            - cases: 3
              name:
                fr: Stigmates
              grants:
                text:
                  fr: "Organe respiratoire (stigmates trachéens)."
      speed:
        walk: 4
        run: 8
  axialSkeleton:
    label:
      fr: Squelette axial + système nerveux central
    description:
      fr: "Vertèbres ferro-cartilagineuses et cordon nerveux centralisé : coordination accrue (nageur ondulant céphalisé)."
    # Le Corps (cephalization) et la Tête (bilateralSymmetry) sont désormais hérités : cette mutation
    # ne les crée plus. Elle CENTRALISE le système nerveux (bloc sur la Tête → +1 ◇/manche) et durcit
    # l'axe. Fatigue 0 (l'endurance est portée par Corps + Cœur en amont).
    kit:
      body:
        fr: un axe nerveux et squelettique interne
      modifyParts:
        - type: head
          descriptionAppend:
            fr: " Crâne ferro-cartilagineux, cordon nerveux centralisé."
          blocksAdd:
            - cases: 2
              name:
                fr: Système nerveux central
              grants:
                text:
                  fr: +1 ◇ au début de la manche
                resource: stability
                amount: 1
        - type: body
          descriptionAppend:
            fr: " Charpenté par un axe ferro-cartilagineux interne."
  jaws:
    label:
      fr: Mâchoires
    description:
      fr: "Mâchoires et dents : préhension, mastication, prédation active (Gnathostomes)."
    kit:
      body:
        fr: des mâchoires dentées
      modifyPart:
        type: head
        blocksAdd:
          - cases: 2
            name:
              fr: Mâchoires
            grants:
              text:
                fr: Confère l'action Morsure
              grantsCard: bite
  predatoryBite:
    label:
      fr: Morsure prédatrice
    description:
      fr: "Mâchoires devenues arme de chasse : morsure déchirante qui fait saigner la proie. (RÉSERVÉE : version améliorée de la Morsure de base des Mâchoires — à poser sur un clade de prédateurs dédié.)"
    kit:
      modifyPart:
        type: head
        blocksAdd:
          - cases: 2
            grants:
              text:
                fr: Confère l'action Morsure déchirante
              grantsCard: rendingBite
  fleshyFins:
    label:
      fr: Nageoires charnues
    description:
      fr: "Nageoires lobées musclées : reptation des hauts-fonds, précurseur des membres."
  weightBearingLimbs:
    label:
      fr: Membres porteurs (sortie de l'eau)
    description:
      fr: "Nageoires charnues devenues pattes portantes : tétrapode-souche encore aquatique."
    # Amphibie : gagne la terre SANS quitter l'eau (aquatic conservé).
    addHabitat: [terrestrial]
    kit:
      body:
        fr: trois paires de membres porteurs (plan hexapode)
      # Trois paires de pattes, même `group: limbs` → fusionnées en « Membres »
      # (blocs nommés) chez un hexapode ; chaque paire confère +1 🍀 Évasion.
      # Un membre repurposé (Serpes/Mains/Pattes griffues) quitte le groupe.
      addParts:
        - type: frontLeg
          tag: mobility
          group: limbs
          name:
            fr: Membres antérieurs
          description:
            fr: Paire de membres avant.
          armor: 0
          blocks:
            - cases: 2
              name:
                fr: Pattes antérieures
              grants:
                text:
                  fr: +1 🍀 Évasion
                resource: evasion
                amount: 1
        - type: middleLeg
          tag: mobility
          group: limbs
          name:
            fr: Membres médians
          description:
            fr: Paire de membres médians.
          armor: 0
          blocks:
            - cases: 3
              name:
                fr: Pattes médianes
              grants:
                text:
                  fr: +1 🍀 Évasion
                resource: evasion
                amount: 1
        - type: rearLeg
          tag: mobility
          group: limbs
          name:
            fr: Membres postérieurs
          description:
            fr: Paire de membres arrière, moteur principal du déplacement.
          armor: 0
          blocks:
            - cases: 3
              name:
                fr: Pattes postérieures
              grants:
                text:
                  fr: +1 🍀 Évasion
                resource: evasion
                amount: 1
      speed:
        walk: 4
        run: 8
  amnioticEgg:
    label:
      fr: Œuf amniote
    description:
      fr: "Œuf clos : reproduction hors de l'eau, conquête de la terre ferme."
    # L'affranchissement de l'eau : les amniotes quittent les marais du Nord pour le terminateur.
    addBiome: [dawn, dusk]
    removeHabitat: [aquatic]
    kit:
      # Pleinement terrestre : la queue-rame aquatique (posée aux Caudés) devient
      # un balancier terrestre. Grade ancestral commun mammifères + sauropsides
      # (avant `fur`), pour que les reptiles héritent aussi d'une queue terrestre.
      modifyPart:
        type: tail
        tag: defensive
        descriptionAppend:
          fr: " Queue devenue balancier terrestre."
        blocksRemove:
          - 0
        blocksAdd:
          - cases: 2
            name:
              fr: Balancier
            grants:
              text:
                fr: Confère Stabilité
              immunity: knockdown
              trait:
                name:
                  fr: Stabilité
                effect:
                  fr: "Insensible au renversement (mise à terre)"
  vision:
    label:
      fr: Vision (yeux)
    description:
      fr: "Œil formant une image (upgrade des taches photosensibles) : exploite la lumière du terminateur."
  dorsalWings:
    label:
      fr: Ailes dorsales (draconides)
    description:
      fr: "Paire dorsale devenue ailes : prédateurs aveugles volants, les « dragons »."
    addHabitat: [aerial]
  quadrupedalism:
    label:
      fr: Quadrupédie (6→4 membres)
    description:
      fr: "Réduction de six à quatre membres : quadrupèdes ; socle de la lignée mammifère prédatrice."
    kit:
      body:
        fr: une silhouette quadrupède (deux paires de pattes)
      removeParts:
        - middleLeg
      speed:
        walk: 5
        run: 10
  ectothermy:
    label:
      fr: Ectothermie
    description:
      fr: "Thermorégulation externe (héliotherme), écailles : définit les Sauropsides."
  endothermy:
    label:
      fr: Endothermie
    description:
      fr: "Sang chaud (thermorégulation interne) : lignée mammifère (Synapsides)."
  cursoriality:
    label:
      fr: Cursorialité
    description:
      fr: "Corps léger et longues pattes : course rapide et soutenue en troupeau."
    kit:
      body:
        fr: un corps léger et de longues pattes cursoriales
      speed:
        walk: 5
        run: 12
  lungs:
    label:
      fr: Poumons + peau respirante
    description:
      fr: "Respiration aérienne (poumons) et cutanée : double vie amphibie."
    kit:
      # Le cri est produit par les poumons / le cou → conféré par le CORPS (pas la Tête).
      modifyPart:
        type: body
        blocksAdd:
          - cases: 3
            name:
              fr: Poumons
            grants:
              text:
                fr: Confère l'action Cri
              grantsCard: cry
      # Organe respiratoire → endurance +2 (principe : endurance = circulatoire/respiratoire/musculaire).
      fatigue: 2
  migratoryMetamorphosis:
    label:
      fr: Métamorphose migratoire (seuil thermique)
    description:
      fr: Au seuil thermique, développe des pattes et migre vers de nouvelles zones humides.
  levantThreshold:
    label:
      fr: "Levant : seuil chaud-sec"
    description:
      fr: Métamorphose et migre quand il fait trop chaud et sec (versant Levant).
    addBiome: [dawn]
  couchantThreshold:
    label:
      fr: "Couchant : seuil froid-humide"
    description:
      fr: Métamorphose et migre quand il fait froid et humide (versant Couchant).
    addBiome: [dusk]
  firstWingPair:
    label:
      fr: Première paire d'ailes
    description:
      fr: "Une paire de membres devient des ailes (lézards ailés : 4 pattes + 2 ailes)."
    addHabitat: [aerial]
  secondWingPair:
    label:
      fr: Seconde paire d'ailes
    description:
      fr: "Seconde paire d'ailes (oiseaux : 2 pattes + 4 ailes ; endothermie convergente)."
  fur:
    label:
      fr: Fourrure (isolation dense)
    description:
      fr: Pelage dense isolant, apparu au pôle Sud froid.
    # LE CREUSET AUSTRAL : la fourrure est ce qui ouvre le pôle Sud (l'endothermie seule ne suffit pas).
    addBiome: [south]
    kit:
      body:
        fr: une fourrure dense
      modifyParts:
        - type: body
          armor_add: 1
          descriptionAppend:
            fr: " Couvert d'une fourrure dense et isolante."
        - type: tail
          blocksAdd:
            - cases: 2
              name:
                fr: Fouet caudal
              grants:
                text:
                  fr: Confère l'action Balayage caudal
                grantsCard: tailSweep
  viviparity:
    label:
      fr: Viviparité
    description:
      fr: "Gestation interne : s'affranchit de l'œuf et recolonise le Nord (mammifères vrais)."
  fatPouches:
    label:
      fr: Poches de graisse
    description:
      fr: "Réserves adipeuses : gros herbivores lents (bétail du Sud)."
    kit:
      body:
        fr: d'épaisses poches de graisse
      # Pas d'endurance brute (la graisse n'est pas un organe d'endurance) → trait de qualité.
      traits:
        - name:
            fr: Réserves adipeuses
          kind: passive
          effect:
            fr: "Ignore le premier palier d'essoufflement : les réserves de graisse tamponnent la fatigue."
  frontalVision:
    label:
      fr: Vision frontale (binoculaire)
    description:
      fr: "Yeux frontaux : relief et estimation des distances, chasse de précision."
    kit:
      body:
        fr: des yeux frontaux au regard perçant
  footPlasticity:
    label:
      fr: Plasticité podale (pied modulable)
    description:
      fr: "Pied modulable (kératine, posture, sole) : quitte le Sud et reconquiert tous les biomes."
    kit:
      body:
        fr: des pieds modulables adaptés au terrain
  externalEmReceptor:
    label:
      fr: Récepteur EM externe (épines)
    description:
      fr: "Une partie de la fourrure devient des épines EM réceptrices : électrosensibilité polydirectionnelle."
    kit:
      body:
        fr: de longues aiguilles électromagnétiques dressées sur la nuque et le dos
  encephalization:
    label:
      fr: Encéphalisation (signaux complexes)
    description:
      fr: "Gros cerveau social : traite les signaux EM complexes."
    kit:
      body:
        fr: un crâne bombé abritant un gros cerveau
      modifyPart:
        type: head
        blocksAdd:
          - cases: 2
            name:
              fr: Cerveau
            grants:
              text:
                fr: +1 ◇ au début de la manche
              resource: stability
              amount: 1
  terrorShriek:
    label:
      fr: Cri sidérant (neural)
    description:
      fr: "Cri neural sidérant : un hurlement télépathique qui glace les proies de la zone. (RÉSERVÉE : version « sidérante » du Cri de base des Poumons — foyer = lignée Télépathe/emEmitter, passe Télépathie.)"
    kit:
      modifyPart:
        type: head
        blocksAdd:
          - cases: 2
            grants:
              text:
                fr: Confère l'action Cri terrifiant
              grantsCard: shriek
  bipedalism:
    label:
      fr: Bipédie
    description:
      fr: Locomotion sur les membres postérieurs ; membres antérieurs libérés, dos encore incliné.
    kit:
      body:
        fr: une station bipède au dos incliné, les antérieurs libérés
      modifyParts:
        - type: rearLeg
          name:
            fr: Pattes
          armor_add: 1
          descriptionAppend:
            fr: " Postérieurs puissants et ramassés, porteurs de la station bipède."
          blocksPrepend:
            - cases: 2
              name:
                fr: Charge
              grants:
                text:
                  fr: +1 action Charge
                grantsCard: charge
        # Les antérieurs quittent la locomotion (sortent du groupe « Membres »,
        # perdent leur bloc d'Évasion) → libres pour Serpes / Mains / etc.
        - type: frontLeg
          group: null
          name:
            fr: Bras
          descriptionAppend:
            fr: " Membres antérieurs libérés de la marche."
          blocksRemove:
            - 0
      speed:
        walk: 4
        run: 8
  uprighting:
    label:
      fr: Redressement (dos se dresse, queue balancier)
    description:
      fr: Le dos se dresse mais la queue reste balancier (verticalisation incomplète).
    kit:
      body:
        fr: un port à demi dressé, la queue faisant office de balancier
  handsAndFullUprighting:
    label:
      fr: Mains + verticalisation complète (perte de la queue)
    description:
      fr: "Verticalisation achevée (perte de la queue) et membres antérieurs devenus mains préhensiles : l'outil et la culture."
    kit:
      body:
        fr: entièrement dressé (sans queue), les mains préhensiles pour l'outil et l'arme
      removeParts:
        - tail
      # Les antérieurs (Bras) ont déjà quitté le groupe via `bipedalism` : ici on
      # les termine en Mains préhensiles.
      modifyPart:
        type: frontLeg
        tag: offensive
        name:
          fr: Mains
        description:
          fr: "Mains préhensiles : manient armes et outils."
        blocksAdd:
          - cases: 2
            name:
              fr: Mains
            grants:
              text:
                fr: Manie armes et outils (équipement)
  trueTissues:
    label:
      fr: Tissus vrais (gastrula)
    description:
      fr: "Gastrulation et vrais tissus (vs éponges) : cavité digestive, ébauche nerveuse."
  cephalization:
    label:
      fr: "Céphalisation : un AVANT + photoception"
    description:
      fr: Un AVANT nerveux portant des taches photosensibles (polarité antéro-postérieure).
    # Le TRONC apparaît ici (partie Corps nue, sans organe). Le Cœur viendra avec ferricCirculation,
    # la Tête avec bilateralSymmetry. Endurance +2 (musculature de base ; principe : endurance =
    # organe circulatoire / respiratoire / musculaire).
    kit:
      body:
        fr: un tronc musculeux
      addParts:
        - type: body
          tag: support
          name:
            fr: Corps
          description:
            fr: Tronc musculeux logeant les viscères.
          armor: 0
          blocks: []
      fatigue: 2
  throughGut:
    label:
      fr: Tube digestif complet
    description:
      fr: "Intestin traversant (bouche vers anus) : alimentation continue, corps plus grands et actifs."
  ferricCirculation:
    label:
      fr: Circulation (sang ferrique)
    description:
      fr: "Cœur, vaisseaux et pigment respiratoire au fer : métabolisme accru ; fournit le fer routé par le Sidérotropisme."
    # Le CŒUR (organe circulatoire) est posé ici, sur le Corps hérité → donné aux Exoferres ET aux
    # Endoferres (ancêtre commun). Endurance +4. Les Vers ronds, qui bifurquent avant, en sont privés.
    kit:
      body:
        fr: un sang ferrique battu par un cœur
      modifyPart:
        type: body
        blocksAdd:
          - cases: 3
            name:
              fr: Cœur
            grants:
              text:
                fr: +2 🫁 au début de la manche
              resource: endurance
              amount: 2
      fatigue: 4
  ossification:
    label:
      fr: Ossification (os porteur)
    description:
      fr: "Os vrai porteur : la gravité hors de l'eau impose un squelette ossifié (les aquatiques restent ferro-cartilagineux)."
    kit:
      body:
        fr: un squelette pleinement ossifié
      modifyPart:
        type: head
        armor_add: 1
        descriptionAppend:
          fr: " Crâne ossifié (protection accrue)."
  lactation:
    label:
      fr: Allaitement (lactation)
    description:
      fr: "Lactation : nourrit le petit au lait — apparaît avant la viviparité (grade monotrème : œuf + lait)."
  sickleClaws:
    label:
      fr: Serpes (ongles → griffes faucheuses)
    description:
      fr: Les ongles des membres antérieurs s'allongent en deux longues serpes tranchantes.
    kit:
      body:
        fr: deux longues serpes recourbées au bout des avant-bras
      removeParts:
        - frontLeg
      addParts:
        - type: sickles
          tag: offensive
          name:
            fr: Serpes
          description:
            fr: "Deux longues faux (ongles allongés en lames recourbées) : l'arme maîtresse."
          armor: 1
          blocks:
            - cases: 3
              name:
                fr: Fil
              grants:
                text:
                  fr: Frappe faucheuse coûte ⚫ (au lieu de ⚫⚫)
                cardCost:
                  card: sickleStrike
                  cost: 1
            - cases: 3
              name:
                fr: Serpes
              grants:
                text:
                  fr: Confère l'action Frappe faucheuse
                grantsCard: sickleStrike
  packMind:
    label:
      fr: Esprit de meute (synchronisation télépathe)
    description:
      fr: "Les télépathes quadrupèdes synchronisent leurs esprits : chacun garde son autonomie, mais ses actes et ses désirs se calquent fortement sur ceux de ses pairs — une contagion sociale intégrée. La meute agit d'un même élan sans dissoudre l'individu."
    kit:
      body:
        fr: des épines EM le long de la colonne (esprits synchronisés)
      modifyPart:
        type: head
        blocksAdd:
          - cases: 2
            name:
              fr: Pool mental
            grants:
              text:
                fr: +1 ◇ au début de la manche (pool partagé de la meute)
              resource: stability
              amount: 1
      traits:
        - name:
            fr: Esprit synchronisé
          kind: passive
          effect:
            fr: Le ◇ est mis en commun dans la meute ; résiste aux effets mentaux ; indissimulable (repérée par un membre = repérée par tous) ; +🍀 Évasion tant qu'elle n'est pas isolée — vulnérable une fois isolée.
  tail:
    label:
      fr: Queue (rame caudale)
    description:
      fr: "Rame caudale post-anale : nage agile en eau ; prérequis de l'endosquelette, marqueur Endoferres."
    kit:
      body:
        fr: une longue queue
      addParts:
        - type: tail
          tag: mobility
          name:
            fr: Queue
          description:
            fr: Longue queue musclée.
          armor: 0
          blocks:
            - cases: 2
              grants:
                fr: "Rame caudale : déplacement en milieu aquatique"
  springLeap:
    label:
      fr: Détente (membres postérieurs à ressort)
    description:
      fr: "Membres postérieurs élastiques (tendons longs) : bonds explosifs et sprint ; fuite anti-embuscade déclenchée par l'alerte EM."
    kit:
      body:
        fr: des membres postérieurs à ressort (bonds explosifs)
      speed:
        walk: 4
        run: 12
  patagium:
    label:
      fr: Voilure (membrane planante)
    description:
      fr: "Une membrane tendue entre les membres antérieurs et les flancs : le bond se prolonge en vol plané d'arbre en arbre ; perche haut, fuit vers le bas, malhabile au sol."
    # Vol plané : 3ᵉ conquête convergente de l'air (avec hydrogenSacs et les ailes vraies).
    addHabitat: [aerial]
  eusociality:
    label:
      fr: Eusocialité (castes)
    description:
      fr: "Division reproductive du travail : une matriarche reproductrice + chasseurs / ouvriers stériles. (différée — réservée à la branche des arthropodes / insectes sociaux, plus basale)"
  pouch:
    label:
      fr: Poche ventrale (marsupium)
    description:
      fr: "Repli cutané ventral où s'accroche la portée : la mère emporte ses petits dans sa fuite plutôt que de les abandonner — réponse de proie qui ne s'arrête jamais."
  polarCoat:
    label:
      fr: Graisse & fourrure polaires
    description:
      fr: "Lard isolant et pelage dense et pâle : permet de tenir au pôle Sud froid, en complément de la chaleur du terrier."
    # Spécialisation polaire : se replie sur le Sud et abandonne le reste de l'aire du clade.
    removeBiome: [north, dawn, dusk]
    kit:
      body:
        fr: un lard isolant et un pelage polaire dense et pâle
      modifyParts:
        - type: body
          armor_add: 1
          descriptionAppend:
            fr: " Épaisse couche de lard isolant."
      # Le lard isole (pas d'endurance brute) → trait de qualité.
      traits:
        - name:
            fr: Isolation polaire
          kind: passive
          effect:
            fr: "Insensible au froid : aucun malus en climat glacial (lard et pelage dense isolent)."
  oilyFur:
    label:
      fr: Fourrure huileuse (étanche)
    description:
      fr: "Pelage dense et huileux, imperméable : permet la vie semi-aquatique dans les lacs et marais du Nord tempéré et pluvieux."
    # Retour à l'eau, très loin après l'œuf amniote qui l'en avait affranchi.
    addHabitat: [aquatic]
  harpoonFangs:
    label:
      fr: Crocs harponneurs (pattes nageuses)
    description:
      fr: "Longs crocs recourbés qui harponnent le poisson et membres devenus rames : prédateur pleinement aquatique."
    removeHabitat: [terrestrial]
  clawHunting:
    label:
      fr: Griffes de chasse
    description:
      fr: "Les griffes des membres antérieurs, ferro-renforcées, deviennent l'arme principale : on lacère au lieu de mordre."
    kit:
      body:
        fr: de longues griffes tranchantes aux pattes avant
      # Les antérieurs deviennent l'arme : ils quittent le groupe « Membres » et
      # perdent leur bloc d'Évasion (pas de bipédie chez les quadrupèdes griffus).
      modifyPart:
        type: frontLeg
        tag: offensive
        group: null
        name:
          fr: Pattes griffues
        descriptionAppend:
          fr: " Griffes ferro-renforcées : l'arme principale."
        blocksRemove:
          - 0
        blocksAdd:
          - cases: 3
            name:
              fr: Griffes
            grants:
              text:
                fr: Confère l'action Lacération
              grantsCard: laceration
  diggingClaws:
    label:
      fr: Griffes fouisseuses
    description:
      fr: "Griffes élargies et renforcées pour creuser : meutes terricoles vivant en galeries communes."
  crypticCoat:
    label:
      fr: Pelage cryptique
    description:
      fr: "Robe disruptive lie-de-vin : se fond dans la flore pourpre et l'écorce ; immobile, l'animal disparaît (camouflage visuel)."
  insectivory:
    label:
      fr: Insectivore
    description:
      fr: "Museau-sonde et dents fines : déterre et perce les arthropodes Exoferres dans l'écorce et le sol."
  climbingClaws:
    label:
      fr: Griffes grimpantes
    description:
      fr: "Griffes courbes semi-rétractiles et chevilles souples : grimpe et se réfugie dans les grands arbres, hors d'atteinte des prédateurs au sol."
  frugivory:
    label:
      fr: Frugivore
    description:
      fr: Dentition et digestion adaptées aux fruits, graines et sève rétinienne de la canopée.
  prehensileTail:
    label:
      fr: Queue préhensile
    description:
      fr: "La queue devient un cinquième membre agrippant : ancrage et suspension dans la canopée."
  whiskers:
    label:
      fr: Vibrisses développées
    description:
      fr: "Longues vibrisses tactiles : navigue branches et cavités dans l'obscurité, sent l'air avant le saut."
