# Déploiement du site public sur le VPS (quadrature.marechal-gao.fr).
#
# Construit l'export statique puis le synchronise dans ~/apps/quadrature-deploy/www/,
# servi par un conteneur nginx derrière Traefik (cf. web/deploy/).
#
# ── Pourquoi construire ICI et jamais en local ────────────────────────────────
# Le visualiseur de combat prérend une page par rapport présent dans
# `simulator/combatReports/` — un dossier gitignoré, donc absent du runner. Un
# build fait sur une machine de développement publierait ces rapports de mise au
# point. Le build public les exclut de toute façon (cf. next.config.ts), mais
# passer par la CI garantit la propriété plutôt que de la supposer.
#
# ── Le relief d'Aeonir ───────────────────────────────────────────────────────
# La route /sig sert une pyramide de tuiles que le pipeline Python produit. Elle
# n'est pas versionnée — la reproductibilité est assurée par le code, pas par le
# stockage — donc elle se fabrique ici, avant le build du site.
#
# ── Secrets à définir dans Settings → Secrets and variables → Actions ─────────
#   VPS_SSH_KEY      clé PRIVÉE (ed25519) autorisée sur le VPS
#   VPS_HOST         51.210.102.237
#   VPS_USER         debian
#   VPS_KNOWN_HOSTS  sortie de `ssh-keyscan 51.210.102.237`
#
# `VPS_KNOWN_HOSTS` évite d'avoir à désactiver la vérification de l'hôte : sans
# elle, la CI accepterait n'importe quel serveur se présentant à cette adresse.

name: Déploiement

on:
  push:
    branches: [master]
  workflow_dispatch:

# Jamais deux déploiements concurrents : ils écriraient dans le même dossier.
# Et on ne coupe pas un déploiement en cours, qui laisserait le site à moitié
# synchronisé.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Construire et publier
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://quadrature.marechal-gao.fr

    steps:
      - uses: actions/checkout@v4

      # ── Le relief : obtenir le MNT, puis le tuiler ───────────────────
      #
      # DEUX étapes, et la séparation est délibérée. Au Lot 7, le terrain
      # d'Aeonir sera défini à la main plutôt que tiré : le MNT cessera d'être
      # une SORTIE reproductible pour devenir un ACTIF. C'est alors la première
      # étape seule qui changera — « produire » deviendra « récupérer » — et le
      # tuilage, le cache et le site n'auront pas à bouger.
      #
      # ⚠️ Ces étapes ne tournent PAS dans ci.yml. Six minutes mesurées en
      # local — davantage sur un runner — sur chaque poussée de chaque branche,
      # pour un artefact que seul le déploiement consomme, serait un mauvais
      # échange. Le prix est assumé : une régression
      # du tuileur se voit ici et non en CI — c'est aussi pourquoi la suite
      # pytest du job `geo`, elle, couvre tiles.py et pyramid.py.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: geo/requirements.txt

      # La clé porte l'empreinte de TOUT ce qui détermine les tuiles : les
      # valeurs de calibration et les cinq modules qui les consomment. Changer
      # une graine, une constante ou une formule invalide le cache — ce qui est
      # exactement le comportement voulu.
      #
      # Pas de `restore-keys` : une pyramide à moitié périmée serait servie sans
      # que rien ne le signale, ce qui coûte bien plus cher à diagnostiquer
      # qu'une reconstruction.
      - name: Restaurer la pyramide de tuiles
        id: tuiles
        uses: actions/cache@v4
        with:
          path: geo/out/tiles
          key: >-
            aeonir-tuiles-${{ hashFiles(
            'geo/aeonir_gis/calibration.json',
            'geo/aeonir_gis/constants.py',
            'geo/aeonir_gis/noise.py',
            'geo/aeonir_gis/dem.py',
            'geo/aeonir_gis/tiles.py',
            'geo/aeonir_gis/pyramid.py') }}

      # La pyramide vectorielle a sa PROPRE clé, et ce n'est pas une commodité :
      # elle dépend de modules que le relief ignore (`hydro`, `export`, `mvt`) et
      # ignore des modules dont le relief dépend. Une clé commune ferait
      # reconstruire les deux à chaque retouche de l'un, soit le coût le plus
      # lourd du déploiement payé pour rien.
      - name: Restaurer la pyramide vectorielle
        id: vecteur
        uses: actions/cache@v4
        with:
          path: geo/out/vector
          key: >-
            aeonir-vecteur-${{ hashFiles(
            'geo/aeonir_gis/calibration.json',
            'geo/aeonir_gis/constants.py',
            'geo/aeonir_gis/noise.py',
            'geo/aeonir_gis/dem.py',
            'geo/aeonir_gis/hydro.py',
            'geo/aeonir_gis/export.py',
            'geo/aeonir_gis/tiles.py',
            'geo/aeonir_gis/pyramid.py',
            'geo/aeonir_gis/mvt.py') }}

      - name: Installer le pipeline
        if: steps.tuiles.outputs.cache-hit != 'true' || steps.vecteur.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt
        working-directory: geo

      # ÉTAPE 1 — obtenir le MNT. C'est celle que le Lot 7 remplacera.
      # Une grille 16 384 × 8 192, soit 422 Mio de GeoTIFF puis COG : 5 min 37 s
      # mesurées en local, à quoi le runner ajoutera sa part.
      #
      # ⚠️ Elle tourne dès que l'une OU l'autre pyramide manque, et le `||` n'est
      # pas de la prudence : le cache ne conserve que les pyramides, jamais le
      # MNT. Un cache de tuiles à jour et un cache vectoriel périmé laisseraient
      # donc l'hydrologie sans son entrée — et elle échouerait sur un fichier
      # absent, à l'étape suivante, pour une raison qui ne s'y lit pas.
      - name: Produire le MNT
        if: steps.tuiles.outputs.cache-hit != 'true' || steps.vecteur.outputs.cache-hit != 'true'
        run: python -m aeonir_gis.dem
        working-directory: geo

      # ÉTAPE 2 — le tuiler. Lit le COG, écrit out/tiles + tiles.json.
      - name: Tuiler le MNT
        if: steps.tuiles.outputs.cache-hit != 'true'
        run: python -m aeonir_gis.pyramid
        working-directory: geo

      # ── L'hydrologie : l'analyser, puis la tuiler ────────────────────
      #
      # Même découpage en deux, pour la même raison : l'analyse est la partie
      # coûteuse et le tuilage la partie qui bouge.
      #
      # ÉTAPE 3 — D8, accumulation, réseau, Strahler, bassins → GeoPackage.
      # C'est l'étape la plus gourmande de toute la chaîne, mais en MÉMOIRE et
      # non en temps : 1,65 Go de pic mesuré, contre 16 Go sur un runner
      # standard. C'est aussi elle qui plafonne le zoom maximal du chantier.
      - name: Analyser l'hydrologie
        if: steps.vecteur.outputs.cache-hit != 'true'
        run: python -m aeonir_gis.export
        working-directory: geo

      # ÉTAPE 4 — la tuiler. Lit le GeoPackage, écrit out/vector + hydro.json.
      # 821 tuiles pour 8,8 Mio, une dizaine de secondes en local.
      - name: Tuiler l'hydrologie
        if: steps.vecteur.outputs.cache-hit != 'true'
        run: python -m aeonir_gis.mvt
        working-directory: geo

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build:public
        working-directory: web

      # Garde-fou : si l'export venait à contenir l'outil local, on s'arrête
      # avant de publier plutôt que de le découvrir en ligne.
      - name: Vérifier l'absence des outils locaux
        run: |
          if [ -e web/out/fr/encounters ] || [ -e web/out/api ]; then
            echo "::error::L'export contient les routes de l'outil local — déploiement interrompu."
            exit 1
          fi
          test -f web/out/index.html || { echo "::error::Export vide."; exit 1; }

      # `copy-aeonir-tiles.mjs` ne tombe PAS en erreur quand les tuiles
      # manquent — c'est voulu, un clone frais doit pouvoir construire le site.
      # Ici, en revanche, leur absence signifierait publier /sig sans relief. On
      # compare donc les deux comptes plutôt que d'inscrire un nombre en dur,
      # qui mentirait dès que --split-zoom bougerait.
      # ⚠️ Le garde compte les DEUX pyramides, et il compte plutôt qu'il ne
      # constate une présence. `copy-aeonir-tiles.mjs` sort en 0 quand une
      # source manque — c'est voulu, un clone frais n'en a aucune — donc une
      # pyramide absente ou tronquée traverserait le build sans un mot et ne se
      # verrait qu'en production, sur une carte à moitié vide.
      - name: Vérifier que les pyramides ont atteint l'export
        run: |
          verifier() {
            nom="$1"; contrat="$2"; source="$3"; cible="$4"; motif="$5"
            test -f "$cible/$contrat" || {
              echo "::error::L'export ne contient pas $contrat — /sig serait sans $nom."
              exit 1
            }
            attendu=$(find "$source" -name "$motif" | wc -l)
            obtenu=$(find "$cible" -name "$motif" | wc -l)
            echo "$nom — produites $attendu, exportées $obtenu"
            test "$attendu" -gt 0 || { echo "::error::Aucune tuile de $nom produite."; exit 1; }
            test "$attendu" = "$obtenu" || {
              echo "::error::L'export ne porte pas toutes les tuiles de $nom."
              exit 1
            }
          }
          verifier "relief" tiles.json geo/out/tiles web/out/aeonir '*.png'
          verifier "hydrologie" hydro.json geo/out/vector web/out/aeonir-hydro '*.pbf'

      - name: Préparer la connexion SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # --delete pour que les pages supprimées disparaissent aussi du serveur.
      # La barre finale de `out/` est significative : on copie le CONTENU du
      # dossier, pas le dossier lui-même.
      - name: Synchroniser vers le VPS
        run: |
          rsync -az --delete --stats \
            -e "ssh -i ~/.ssh/id_ed25519" \
            web/out/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/apps/quadrature-deploy/www/"

      - name: Vérifier que le site répond
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 \
                 https://quadrature.marechal-gao.fr/fr/)
          echo "GET /fr/ → $code"
          test "$code" = "200"
